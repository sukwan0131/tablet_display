<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D1316">
<title>연수 안내 디스플레이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --paper:#F3F5F4; --card:#FFFFFF; --ink:#13202A; --muted:#5D6D74; --line:#DCE2E0;
  --board:#16735B; --board-ink:#FFFFFF; --signal:#F0B90B; --signal-ink:#1D1A0C; --alert:#D0192F;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1316; --card:#151D21; --ink:#E8EEEB; --muted:#8B9B98; --line:#233033;
    --board:#3DB38E; --board-ink:#05120E;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1316; --card:#151D21; --ink:#E8EEEB; --muted:#8B9B98; --line:#233033;
  --board:#3DB38E; --board-ink:#05120E;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--board);outline-offset:2px}
#app{height:100%}
.hidden{display:none!important}
.probe{position:absolute;visibility:hidden;width:calc(var(--u) * 100);height:0}

/* ================= 디스플레이 ================= */
.display{
  --u:calc(min(1vw,1.7778vh) * var(--scale,1));
  height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;grid-template-columns:minmax(0,1fr);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
  overflow:hidden;user-select:none;-webkit-user-select:none;position:relative;
  background:var(--paper);color:var(--ink);font-family:var(--font);
}
.display.portrait{--u:calc(min(1.5vw,1vh) * var(--scale,1))}
.bgl{position:absolute;inset:0;pointer-events:none}
.bgi{background-size:cover;background-position:center}
.bgd{background:var(--paper)}
.d-head,.pins,.progress,.ticker,.sleep{position:relative;z-index:1}
.d-head{grid-row:1;display:flex;align-items:center;gap:calc(var(--u)*2);padding:calc(var(--u)*2.2) calc(var(--u)*3.6) calc(var(--u)*1.8);border-bottom:1px solid var(--line)}
.brand{flex:1;min-width:0}
.brand .t{font-size:calc(var(--u)*1.9);font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .s{font-size:calc(var(--u)*1.3);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-chip{max-width:38%;display:flex;gap:calc(var(--u)*.8);align-items:baseline;font-size:calc(var(--u)*1.45);background:color-mix(in srgb,var(--board) 16%,transparent);padding:calc(var(--u)*.55) calc(var(--u)*1.2);border-radius:99px;white-space:nowrap;overflow:hidden}
.now-chip b{color:var(--board);font-weight:700}
.now-chip span{overflow:hidden;text-overflow:ellipsis}
.wk{font-size:calc(var(--u)*1.4);color:var(--muted);white-space:nowrap}
.cls{font:inherit;color:inherit;background:transparent;font-size:calc(var(--u)*1.8);font-weight:600;border:1px solid var(--line);padding:calc(var(--u)*.35) calc(var(--u)*1.2);border-radius:calc(var(--u)*.6);white-space:nowrap;cursor:pointer;line-height:1.3}
.cls:active{background:var(--card)}
.clock{text-align:right;font-variant-numeric:tabular-nums;line-height:1.1}
.clock .hm{font-size:calc(var(--u)*3);font-weight:500}
.clock .dt{font-size:calc(var(--u)*1.2);color:var(--muted)}
.net{width:calc(var(--u)*.8);height:calc(var(--u)*.8);border-radius:50%;background:var(--board);flex:none;opacity:.8}
.net.off{background:var(--alert);opacity:1;animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}

.pins{grid-row:2;display:flex;flex-direction:column;gap:calc(var(--u)*.7);padding:0 calc(var(--u)*3.6)}
.pins:not(:empty){padding-top:calc(var(--u)*1.4)}
.pin{min-width:0;display:flex;align-items:center;gap:calc(var(--u)*1.4);background:var(--card);border:1px solid var(--line);border-left:calc(var(--u)*.55) solid var(--pc);border-radius:calc(var(--u)*.8);padding:calc(var(--u)*.9) calc(var(--u)*1.6);cursor:pointer;animation:pinIn .45s ease both}
@keyframes pinIn{from{opacity:0;transform:translateY(-30%)}to{opacity:1;transform:none}}
.pin.emergency{--pc:var(--alert);background:color-mix(in srgb,var(--alert) 14%,var(--card))}
.pin.breaking{--pc:var(--signal);background:color-mix(in srgb,var(--signal) 14%,var(--card))}
.pin.info{--pc:var(--board)}
.pin .tg{font-size:calc(var(--u)*1.25);font-weight:700;padding:calc(var(--u)*.2) calc(var(--u)*.8);border-radius:calc(var(--u)*.4);background:var(--pc);color:#fff;white-space:nowrap}
.pin.breaking .tg{color:var(--signal-ink)}
.pin.info .tg{color:var(--board-ink)}
.pin .pt{flex:1;min-width:0;font-size:calc(var(--u)*1.8);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin .pt small{font-weight:400;color:var(--muted);margin-left:calc(var(--u)*1)}
.pin .pm{font-size:calc(var(--u)*1.2);color:var(--muted);white-space:nowrap;text-align:right}

.stage{grid-row:3;position:relative;z-index:1;margin:calc(var(--u)*2.6) calc(var(--u)*3.6) 0;overflow:hidden}
.sleep{grid-row:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.4)}
.sleep .big{font-size:calc(var(--u)*11);font-weight:500;font-variant-numeric:tabular-nums;color:var(--muted)}
.sleep p{font-size:calc(var(--u)*1.8);color:var(--muted);margin:0}
.is-sleep .stage,.is-sleep .progress,.is-sleep .ctrl{display:none}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.fx-fade .slide{animation:fadeIn .7s ease both}
.fx-fade .slide.out{animation:fadeOut .6s ease both}
.fx-slide .slide{animation:slideIn .7s cubic-bezier(.2,.7,.2,1) both}
.fx-slide .slide.out{animation:slideOut .6s ease both}
.fx-slide.rev .slide{animation-name:slideInRev}
.fx-slide.rev .slide.out{animation-name:slideOutRev}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes slideIn{from{opacity:0;transform:translateX(5%)}to{opacity:1;transform:none}}
@keyframes slideOut{from{opacity:1;transform:none}to{opacity:0;transform:translateX(-5%)}}
@keyframes slideInRev{from{opacity:0;transform:translateX(-5%)}to{opacity:1;transform:none}}
@keyframes slideOutRev{from{opacity:1;transform:none}to{opacity:0;transform:translateX(5%)}}

.eyebrow{margin:0;font-size:calc(var(--u)*1.5);color:var(--muted);font-weight:500}
.wifi{flex:1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:calc(var(--u)*5);align-items:center;min-height:0}
.wifi-main{min-width:0;display:flex;flex-direction:column;gap:calc(var(--u)*2.8)}
.wifi-main h2{margin:0;font-size:calc(var(--u)*2.2);font-weight:600;color:var(--board)}
.wifi-main h2 small{display:block;color:var(--muted);font-weight:400;font-size:calc(var(--u)*1.4);margin-top:calc(var(--u)*.4)}
.lab{display:block;font-size:calc(var(--u)*1.35);color:var(--muted);margin-bottom:calc(var(--u)*.7)}
.ssid{font-size:calc(var(--u)*4.6);font-weight:700;line-height:1.15;word-break:break-all}
.tiles{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.6);--t:calc(var(--u)*6)}
.tile{width:var(--t);height:calc(var(--t)*1.28);background:var(--card);border:1px solid var(--line);border-radius:calc(var(--t)*.14);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:calc(var(--t)*.68);line-height:1;position:relative}
.tile.dg{color:var(--board)}
.tile i{font-style:normal;font-family:var(--font);font-weight:500;font-size:calc(var(--t)*.16);color:var(--muted);position:absolute;bottom:calc(var(--t)*.08);white-space:nowrap}
.nopass{font-size:calc(var(--u)*3);font-weight:600}
.qr{margin:0;background:#fff;color:#111;border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*1.6);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1)}
.qr-code img,.qr-code canvas{display:block;width:calc(var(--u)*21)!important;height:calc(var(--u)*21)!important;image-rendering:pixelated}
.qr figcaption{font-size:calc(var(--u)*1.3);text-align:center;max-width:calc(var(--u)*21)}
.portrait .wifi{grid-template-columns:1fr;align-content:center;gap:calc(var(--u)*3)}
.portrait .qr{justify-self:center}

.notice{flex:1;display:flex;flex-direction:column;min-height:0;gap:calc(var(--u)*2.2)}
.n-head::before{content:"";display:block;width:calc(var(--u)*4.5);height:calc(var(--u)*.5);border-radius:9px;background:var(--tone,var(--board));margin-bottom:calc(var(--u)*1.6)}
.n-title{margin:calc(var(--u)*.4) 0 0;font-size:calc(var(--u)*4.2);line-height:1.22;font-weight:700;word-break:keep-all;overflow-wrap:anywhere}
.n-body{flex:1;min-height:0;overflow:hidden;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;line-height:1.6;font-size:calc(var(--u)*3)}
.n-body strong{color:var(--tone,var(--board));font-weight:700}
.tone-yellow{--tone:#D9A400}.tone-red{--tone:var(--alert)}.tone-ink{--tone:var(--ink)}

.media{flex:1;margin:0;display:flex;flex-direction:column;gap:calc(var(--u)*1.2);min-height:0}
.mwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;border-radius:calc(var(--u)*1);overflow:hidden}
.mwrap img{max-width:100%;max-height:100%;object-fit:contain;display:block;border-radius:calc(var(--u)*1);opacity:0;transition:opacity .4s}
.mwrap img.ok{opacity:1}
.fit-cover .mwrap img{width:100%;height:100%;object-fit:cover}
.media figcaption{font-size:calc(var(--u)*2);font-weight:500;text-align:center}

.tt{flex:1;display:flex;flex-direction:column;min-height:0;gap:calc(var(--u)*1.6)}
.tt-h{display:flex;align-items:baseline;gap:calc(var(--u)*1.6)}
.tt-h h2{margin:0;font-size:calc(var(--u)*3.4);font-weight:700}
.tt-list{flex:1;min-height:0;overflow:hidden;list-style:none;margin:0;padding:0;font-size:calc(var(--u)*2.4);display:flex;flex-direction:column;gap:.25em}
.tt-row{display:grid;grid-template-columns:6.4em minmax(0,1fr) auto;gap:1em;align-items:center;padding:.5em .8em;border-radius:.4em;position:relative;overflow:hidden}
.tt-row .tm{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85em}
.tt-row .ti{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt-row .ti small{font-weight:400;color:var(--muted);margin-left:.7em;font-size:.72em}
.tt-row .ts{font-size:.7em;font-weight:600;white-space:nowrap}
.tt-row.past{opacity:.4}
.tt-row.next{box-shadow:inset 0 0 0 1px var(--line)}
.tt-row.next .ts{color:var(--board)}
.tt-row.now{background:var(--board);color:var(--board-ink)}
.tt-row.now .tm,.tt-row.now small{color:inherit;opacity:.85}
.tt-row.now .bar{position:absolute;left:0;bottom:0;height:.14em;width:calc(var(--p) * 100%);background:var(--board-ink);opacity:.5}

.empty{flex:1;display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*1.2)}
.empty h2{margin:0;font-size:calc(var(--u)*3.6);font-weight:700}
.empty p{margin:0;font-size:calc(var(--u)*1.7);color:var(--muted)}

.progress{grid-row:4;display:flex;gap:calc(var(--u)*.5);margin:calc(var(--u)*1.8) calc(var(--u)*3.6) calc(var(--u)*1.6);min-height:3px}
.progress i{flex:1;height:3px;border-radius:9px;background:var(--line);overflow:hidden;position:relative}
.progress i.done{background:var(--muted)}
.progress i b{position:absolute;inset:0;background:var(--board);transform-origin:left;transform:scaleX(0)}

.ticker{grid-row:5;display:flex;align-items:center;gap:calc(var(--u)*1.6);background:var(--card);border-top:1px solid var(--line);height:calc(var(--u)*5*var(--ts,1));overflow:hidden;padding-left:calc(var(--u)*3.6)}
.ticker .tag{flex:none;background:var(--signal);color:var(--signal-ink);font-weight:700;border-radius:calc(var(--u)*.4);padding:calc(var(--u)*.25) calc(var(--u)*.9);font-size:calc(var(--u)*1.4*var(--ts,1))}
.ticker .rail{flex:1;position:relative;overflow:hidden;align-self:stretch}
.ticker .run{position:absolute;top:0;bottom:0;left:0;display:flex;align-items:center;white-space:nowrap;font-size:calc(var(--u)*2*var(--ts,1));will-change:transform}
.ticker .run.static{transition:opacity .5s}
.ticker .sep{display:inline-block;width:calc(var(--u)*.5);height:calc(var(--u)*.5);background:var(--muted);border-radius:50%;margin:0 calc(var(--u)*2.6);vertical-align:middle}

.overlay{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--u)*5) calc(var(--u)*6);gap:calc(var(--u)*2);animation:fadeIn .4s ease both;cursor:pointer}
.overlay .lv{font-size:calc(var(--u)*2.2);font-weight:700;display:flex;align-items:center;gap:calc(var(--u)*1)}
.overlay .lv::before{content:"";width:calc(var(--u)*1.3);height:calc(var(--u)*1.3);border-radius:50%;background:currentColor;animation:blink 1.2s steps(2) infinite}
.overlay h1{margin:0;font-size:calc(var(--u)*6);line-height:1.18;word-break:keep-all;overflow-wrap:anywhere}
.overlay .ob{max-height:45%;overflow:hidden;font-size:calc(var(--u)*3.2);line-height:1.5;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.overlay .of{font-size:calc(var(--u)*1.5);opacity:.85;display:flex;gap:calc(var(--u)*2);flex-wrap:wrap;align-items:center}
.overlay .cd{height:4px;background:currentColor;opacity:.35;transform-origin:left;margin-top:calc(var(--u)*1);border-radius:9px}
.ov-emergency{background:var(--alert);color:#fff}
.ov-breaking{background:var(--signal);color:var(--signal-ink)}

.ctrl{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + var(--u)*7.5);transform:translateX(-50%);z-index:30;display:flex;gap:calc(var(--u)*.6);background:color-mix(in srgb,var(--ink) 88%,transparent);padding:calc(var(--u)*.6);border-radius:99px;transition:opacity .3s,transform .3s}
.ctrl.off{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(20%)}
.ctrl button{border:0;background:transparent;color:var(--paper);font-size:calc(var(--u)*1.6);font-weight:600;padding:calc(var(--u)*.9) calc(var(--u)*2.2);border-radius:99px;cursor:pointer;min-height:44px}
.ctrl button:active{background:color-mix(in srgb,var(--paper) 18%,transparent)}
.ctrl .pz{color:var(--signal)}
.hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + var(--u)*8);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:calc(var(--u)*.9) calc(var(--u)*1.8);border-radius:99px;font-size:calc(var(--u)*1.35);z-index:29;transition:opacity .5s;pointer-events:none;white-space:nowrap}
.pv-bar{position:fixed;left:calc(var(--u)*2);top:calc(env(safe-area-inset-top,0px) + var(--u)*.6);z-index:60}
.pv-bar button{border:0;background:var(--signal);color:var(--signal-ink);border-radius:99px;padding:8px 16px;font-weight:700;cursor:pointer;font-size:14px;font-family:var(--font)}

@media (prefers-reduced-motion:reduce){
  .fx-fade .slide,.fx-slide .slide,.slide.out,.pin,.overlay{animation-duration:.01s!important}
  .overlay .lv::before,.net.off{animation:none}
}

/* ================= 공통 UI ================= */
.modal{position:fixed;inset:0;z-index:100;background:rgba(5,12,14,.5);display:grid;place-items:center;padding:20px}
.modal .box{background:var(--card);color:var(--ink);border-radius:16px;max-width:460px;width:100%;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.3);font-family:var(--font)}
.modal h3{margin:0 0 8px;font-size:18px}
.modal p{margin:0 0 18px;color:var(--muted);line-height:1.6;white-space:pre-wrap;font-size:14.5px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal .menu{display:grid;gap:8px}
.modal .menu .btn{text-align:left;padding:12px 14px}
.modal .stack{display:grid;gap:10px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 15px;cursor:pointer;font-weight:500;font-size:14px;line-height:1.3;transition:border-color .15s,background .15s;white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--muted) 60%,var(--line))}
.btn.pri{background:var(--board);color:var(--board-ink);border-color:var(--board);font-weight:600}
.btn.warn{background:var(--alert);color:#fff;border-color:var(--alert);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;cursor:pointer;font-size:14.5px;font-weight:500;color:var(--muted);padding:8px 10px 8px 4px;border-radius:8px}
.back:hover{color:var(--ink)}
.back::before{content:"";width:9px;height:9px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-left:6px}
.link{border:0;background:none;color:var(--board);cursor:pointer;padding:0;font-size:14px;text-decoration:underline}

.setup{max-width:900px;margin:0 auto;padding:28px 24px 48px}
.setup h1{font-size:28px;margin:18px 0 8px;font-weight:700}
.setup p{color:var(--muted);margin:0 0 28px;line-height:1.6}
.grid-cls{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.grid-cls button{padding:20px 10px;font-size:18px;font-weight:600;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.grid-cls button:hover,.grid-cls button[aria-current="true"]{border-color:var(--board)}
.grid-cls button[aria-current="true"]{box-shadow:inset 0 0 0 1px var(--board)}
.grid-cls button.lobby{grid-column:1/-1;font-size:16px;text-align:left;padding:16px 18px}
.grid-cls button.lobby small{display:block;color:var(--muted);font-weight:400;font-size:13px;margin-top:3px}

.adm{min-height:100%;font-size:15px}
.adm-top{display:flex;gap:10px;align-items:center;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.adm-top .ttl{flex:1;min-width:0}
.adm-top h1{font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adm-top .mode{font-size:12.5px;color:var(--muted)}
.adm-top .me{font-size:13px;color:var(--muted);white-space:nowrap}
.adm-top .me b{color:var(--ink)}
.adm-top .r{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;padding:10px 20px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:57px;z-index:19}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;color:var(--muted);white-space:nowrap;font-size:14.5px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--paper);font-weight:600}
.adm-body{display:grid;grid-template-columns:minmax(0,1fr) 460px;gap:24px;max-width:1600px;margin:0 auto;padding:24px 20px 130px;align-items:start}
.adm-body.nopv{grid-template-columns:minmax(0,1fr);max-width:1120px}
.adm-body.nopv .pv-panel{display:none}
.adm-main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px;scroll-margin-top:130px}

  weekDates() {

    const wifi = d.wifi.map((w, i) => `<div class="item" data-pk="wifi:${esc(w.id)}">${this.itemHead('wifi', i, d.wifi.length, 'Wi-Fi ' + (i + 1), w)}

      <label class="f"><span>보안 방식</span><select data-k="wifi.${i}.security">${[['WPA', 'WPA/WPA2 (일반)'], ['WEP', 'WEP'], ['nopass', '비밀번호 없음']].map(([v, n]) => `<option value="${v}"${(w.security || 'WPA') === v ? ' selected' : ''}>${n}</option>`).join('')}</select></label>
      <label class="f"><span>메모 (선택)</span><input type="text" data-k="wifi.${i}.note" value="${esc(w.note)}" placeholder="예: 3층 강의실 전용"></label></div>

    const notices = d.notices.map((n, i) => `<div class="item" data-pk="n:${esc(n.id)}">${this.itemHead('notices', i, d.notices.length, '공지 ' + (i + 1), n)}

      ${this.targetPicker('notices.' + i + '.target', n.target)}
      <details${n.from || n.to || n.sec || (n.tone && n.tone !== 'base') ? ' open' : ''}><summary>게시 기간 · 표시 방식</summary>
        ${this.period('notices.' + i, n)}
        <div class="row"><label class="f"><span>표시 시간 (초, 비우면 기본값)</span><input type="number" min="3" max="300" data-k="notices.${i}.sec" value="${esc(n.sec || '')}" placeholder="${S.config.slideSec}"></label>
        <label class="f"><span>강조 색</span><select data-k="notices.${i}.tone">${Object.entries(TONES).map(([v, t]) => `<option value="${v}"${(n.tone || 'base') === v ? ' selected' : ''}>${t}</option>`).join('')}</select></label>
        <label class="check" style="align-self:end;padding-bottom:10px"><input type="checkbox" data-k="notices.${i}.hidden" ${n.hidden ? 'checked' : ''}>잠시 숨기기</label></div>
      </details></div>`).join('');
    const media = d.media.map((m, i) => `<div class="item" data-pk="m:${esc(m.id)}">${this.itemHead('media', i, d.media.length, esc(m.title || '이미지 ' + (i + 1)), m)}
      <img class="thumb" data-src="${esc(m.src)}" alt="">
      <div class="row" style="grid-template-columns:1fr"><label class="f"><span>화면 아래 설명 (선택)</span><input type="text" data-k="media.${i}.caption" value="${esc(m.caption)}"></label></div>

      ${this.targetPicker('media.' + i + '.target', m.target)}
      <details${m.from || m.to ? ' open' : ''}><summary>게시 기간 · 숨기기</summary>${this.period('media.' + i, m)}<label class="check"><input type="checkbox" data-k="media.${i}.hidden" ${m.hidden ? 'checked' : ''}>잠시 숨기기</label></details></div>`).join('');
    return `
      <nav class="jump"><a href="#sec-basic">기본 정보</a><a href="#sec-tt">시간표 ${d.timetable.length}</a><a href="#sec-wifi">Wi-Fi ${d.wifi.length}</a><a href="#sec-notice">공지 ${d.notices.length}</a><a href="#sec-media">이미지·PDF ${d.media.length}</a><a href="#sec-ticker">흐르는 문구</a></nav>
      <section class="card" data-ctx="week" id="sec-basic"><h2>기본 정보</h2><p class="desc">시작일~종료일 사이에는 이 주차가 자동으로 화면에 나옵니다.</p>
        <div class="row"><label class="f"><span>주차 이름</span><input type="text" data-k="label" value="${esc(d.label)}" placeholder="예: 3주차"></label>
        <label class="f"><span>시작일</span><input type="date" data-k="start" value="${esc(d.start)}"></label>
        <label class="f"><span>종료일</span><input type="date" data-k="end" value="${esc(d.end)}"></label></div></section>
      <section class="card" data-ctx="week" id="sec-tt" data-pk="tt"><h2>시간표</h2><p class="desc">‘매일’은 이 주 모든 날에 나옵니다. 날짜를 고르면 그날만 나옵니다. 태블릿에는 오늘 것만, 지금 진행 중인 교시를 강조해 보여줍니다.</p>
        ${d.timetable.length ? `<div class="tt-ed tt-head"><span>날짜</span><span>시작</span><span>종료</span><span>제목</span><span>장소·강사</span><span></span></div>` : ''}${tt}
        <div class="inline" style="margin-top:6px"><button class="btn" data-act="add-tt">+ 한 줄 추가</button><button class="btn" data-act="tt-sort">시간순 정렬</button><button class="btn" data-act="tt-paste">여러 줄 붙여넣기</button></div></section>
      <section class="card" data-ctx="week" id="sec-wifi"><h2>Wi-Fi</h2><p class="desc">여러 개를 넣으면 순서대로 돌아갑니다. 반마다 공유기가 다르면 대상을 ‘특정 반만’으로 나눠 넣으세요.</p>${wifi}<button class="btn" data-act="add-wifi">+ Wi-Fi 추가</button></section>
      <section class="card" data-ctx="week" id="sec-notice"><h2>공지사항</h2><p class="desc">위에서부터 순서대로 돌아갑니다. 게시 기간을 정하면 그 시각에 자동으로 켜지고 꺼집니다.</p>${notices}<button class="btn" data-act="add-notice">+ 공지 추가</button></section>
      <section class="card" data-ctx="week" id="sec-media"><h2>이미지·PDF</h2><p class="desc">이미지는 한 장씩, PDF는 쪽마다 한 장씩 슬라이드가 됩니다(최대 40쪽). 화면 해상도에 맞춰 줄여서 저장합니다.</p>
        ${Store.canUpload() ? `<div class="drop" id="drop" data-act="pick-file">여기로 파일을 끌어오거나 눌러서 고르세요 · JPG, PNG, PDF</div>` : `<div class="note">이 계정은 파일을 올릴 권한이 없습니다. 페이지 소유자에게 편집 권한을 요청하세요.</div>`}
        <div class="media-grid">${media}</div></section>
      <section class="card" data-ctx="week" id="sec-ticker"><h2>흐르는 문구</h2><p class="desc">화면 아래 띠에 흐릅니다. 한 줄에 하나씩 쓰세요.</p><textarea rows="3" data-k="ticker" placeholder="예: 점심은 12:00~13:00, 2층 연회장에서 제공됩니다">${esc(d.ticker)}</textarea></section>`;
  },
  bindDrop() {
    const dz = $('#drop'); if (!dz) return;
    dz.ondragover = e => { e.preventDefault(); dz.classList.add('over'); };
    dz.ondragleave = () => dz.classList.remove('over');
    dz.ondrop = e => { e.preventDefault(); dz.classList.remove('over'); this.addFiles(Array.from(e.dataTransfer.files || [])); };
  },
  async addFiles(files) {
    if (!files.length || !this.draft) return;
    if (this.busy) return toast('이전 파일을 처리하는 중입니다');
    this.busy = true;
    const big = Store.mode !== 'local', maxSide = big ? 1920 : 1280, q = big ? 0.85 : 0.72;
    let added = 0, lastKey = null;
    try {
      for (const f of files) {
        const base = f.name.replace(/\.[^.]+$/, '');
        if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) {
          toast('PDF 여는 중…', 60000);
          const { blobs, total } = await pdfToBlobs(f, maxSide, q, (i, n) => toast(`PDF 변환 중 ${i}/${n}`, 60000));
          const group = uid();
          for (let i = 0; i < blobs.length; i++) {
            toast(`올리는 중 ${i + 1}/${blobs.length}`, 60000);
            const src = await Store.putMedia(blobs[i]), id = uid();
            this.draft.media.push({ id, title: blobs.length > 1 ? `${base} (${i + 1}/${blobs.length})` : base, src, fit: 'contain', caption: '', sec: '', target: 'all', from: '', to: '', hidden: false, group });
            added++; lastKey = lastKey || 'm:' + id;
          }
          if (total > blobs.length) toast(`PDF가 ${total}쪽이라 앞 ${blobs.length}쪽만 넣었습니다`, 4000);
        } else if (/^image\//.test(f.type)) {
          toast('이미지 올리는 중…', 60000);
          const src = await fileToMedia(f, maxSide), id = uid();
          this.draft.media.push({ id, title: base, src, fit: 'contain', caption: '', sec: '', target: 'all', from: '', to: '', hidden: false });
          added++; lastKey = lastKey || 'm:' + id;
        } else toast(`${f.name}: 이미지나 PDF만 올릴 수 있습니다`, 3500);
      }
      if (added) { this.markDirty(); Preview.key = lastKey; this.rerenderKeep(); toast(`${added}장을 추가했습니다. 저장하면 태블릿에 나옵니다`); }
    } catch (x) { console.warn(x); toast(x && x.code ? saveErr(x) : '파일을 처리하지 못했습니다. 다른 파일로 시도해 보세요.', 4000); if (added) { this.markDirty(); this.rerenderKeep(); } }
    finally { this.busy = false; }
  },
  targetPicker(key, t) {
    const all = !Array.isArray(t), sel = all ? [] : t;
    return `<div class="target"><div class="seg" role="radiogroup" aria-label="표시 대상">
      <label><input type="radio" name="tg-${key}" data-tmode="${key}" value="all" ${all ? 'checked' : ''}>전체 반</label>
      <label><input type="radio" name="tg-${key}" data-tmode="${key}" value="pick" ${!all ? 'checked' : ''}>특정 반만</label></div>
      ${!all ? `<div class="chips">${S.config.classes.map(c => `<label class="chip"><input type="checkbox" data-tc="${key}" value="${esc(c.id)}" ${sel.includes(c.id) ? 'checked' : ''}>${esc(c.name)}</label>`).join('')}
        <button type="button" class="btn sm" data-act="tg-all" data-tk="${key}">모두</button><button type="button" class="btn sm" data-act="tg-none" data-tk="${key}">비우기</button></div>` : ''}</div>`;
  },
  ctxObj(el) {
    const c = el.closest('[data-ctx]'); const k = c && c.dataset.ctx;
    return { week: this.draft, cfg: this.cfgDraft, alert: this.alertDraft }[k] || null;
  },
  setPath(obj, path, v) {
    const ks = path.split('.'); let o = obj;
    for (let i = 0; i < ks.length - 1; i++) { const k = /^\d+$/.test(ks[i]) ? +ks[i] : ks[i]; if (o[k] == null) o[k] = {}; o = o[k]; }
    o[ks[ks.length - 1]] = v;
  },
  getPath(obj, path) { return path.split('.').reduce((o, k) => o == null ? o : o[/^\d+$/.test(k) ? +k : k], obj); },
  quiet(el) { return !!el.closest('[data-ctx="alert"]'); },
  onInput(e) {
    const el = e.target;
    if (el.id === 'logQ') { this.logFilter = el.value; const pos = el.selectionStart; this.renderTab(); const q = $('#logQ'); if (q) { q.focus(); q.setSelectionRange(pos, pos); } return; }
    if (!el.dataset.k) return;
    const obj = this.ctxObj(el); if (!obj) return;
    if (el.type === 'radio' && !el.checked) return;
    let v = el.type === 'checkbox' ? el.checked : el.value;
    if (el.type === 'number' || el.type === 'range') v = el.value === '' ? '' : Number(el.value);
    this.setPath(obj, el.dataset.k, v);
    if (el.type === 'range') { const o = el.parentElement.querySelector('output'); if (o) o.textContent = el.value + (o.dataset.unit || ''); }
    if (el.type === 'color') { const c = el.parentElement.querySelector('code'); if (c) c.textContent = el.value.toUpperCase(); const r = el.parentElement.querySelector('[data-act="clr-reset"]'); if (r) r.disabled = false; this.markPresets(); }
    if (!this.quiet(el)) this.markDirty();
    Preview.schedule();
  },
  onChange(e) {
    const el = e.target;
    if (el.dataset.k && (el.tagName === 'SELECT' || el.type === 'checkbox' || el.type === 'radio' || /date|time/.test(el.type))) {
      this.onInput(e);
      if (el.dataset.k === 'weekMode' || el.dataset.k === 'hours.on' || el.dataset.k === 'ticker.on' || el.dataset.k === 'timetable.on') this.rerenderKeep();
    }
    if (el.dataset.tmode) {
      const obj = this.ctxObj(el); if (!obj) return;
      this.setPath(obj, el.dataset.tmode, el.value === 'all' ? 'all' : []);
      if (!this.quiet(el)) this.markDirty();
      this.rerenderKeep();
    }
    if (el.dataset.tc) {
      const obj = this.ctxObj(el); if (!obj) return;
      let arr = this.getPath(obj, el.dataset.tc); if (!Array.isArray(arr)) arr = [];
      arr = el.checked ? Array.from(new Set([...arr, el.value])) : arr.filter(x => x !== el.value);
      this.setPath(obj, el.dataset.tc, arr);
      if (!this.quiet(el)) this.markDirty();
      Preview.schedule();
    }
    if (el.dataset.lv) { this.alertDraft.level = el.value; Preview.schedule(); }
  },
  rerenderKeep() {
    const y = scrollY;
    if (this.tab === 'weeks' && $('#wkEd')) { $('#wkEd').innerHTML = this.weekEditor(); this.bindDrop(); this.fillThumbs(); Preview.schedule(); }
    else this.renderTab();
    scrollTo(0, y);
  },
  async onClick(e) {
    const tabBtn = e.target.closest('[data-tab]'); if (tabBtn) return this.switchTab(tabBtn.dataset.tab);
    const b = e.target.closest('[data-act]'); if (!b) return;
    const H = this.actions[b.dataset.act]; if (H) { e.preventDefault(); await H.call(this, b); }
  },
  async saveWeeks(list, action, detail, undo) {
    await Store.set('app/weeks', { list });
    S.weeks = list;
    writeLog(action, detail, undo);
  },
  async saveConfig(cfg, action, detail) {
    const before = pickConfig(S.config);
    await Store.set('app/config', cfg);
    S.config = cfg;
    writeLog(action, detail || diffConfig(before, pickConfig(cfg)), { type: 'config', data: before });
  },
  markPresets() {
    if (!this.cfgDraft) return;
    const L = look(this.cfgDraft);
    $$('.swatch').forEach(b => { const p = STYLE_PRESETS[+b.dataset.i][1], P = look({ theme: p.theme, style: p }); b.setAttribute('aria-pressed', P.bg === L.bg && P.ink === L.ink && P.accent === L.accent); });
  },
  async setBgImage(f) {
    if (!/^image\//.test(f.type)) return toast('이미지 파일만 배경으로 쓸 수 있습니다');
    try { toast('배경 이미지 올리는 중…', 60000); const src = await fileToMedia(f); this.ensureCfg().style.bgImage = src; this.markDirty(); this.renderTab(); toast('배경 이미지를 넣었습니다. 저장하면 태블릿에 적용됩니다'); }
    catch (x) { toast(x && x.code ? saveErr(x) : '이미지를 처리하지 못했습니다'); }
  },
  actions: {
    async back() { if (this.dirty && !(await ask('저장하지 않은 변경', '저장하지 않은 내용이 사라집니다. 이동할까요?', '이동', true))) return; this.dirty = false; goBack(); },
    async logout() { this.dirty = false; this.stop(); await Auth.logout(); show(home()); },
    'pv-toggle'() { Preview.toggle(); },
    async preview() {
      if (this.dirty) toast('저장하지 않은 내용은 크게 보기에 나오지 않습니다. 오른쪽 미리보기로 확인하세요', 3500);
      S.preview = true; S.previewClass = Preview.cls || (S.config.classes[0] || {}).id; this.dirty = false; route('display');
    },
    async goto(b) { this.switchTab(b.dataset.t); },
    async 'reload-all'() {
      if (!(await ask('모든 태블릿 새로고침', '켜져 있는 모든 안내 화면이 몇 초 안에 다시 불러와집니다.', '새로고침'))) return;
      const cfg = clone(S.config); cfg.reloadToken = Date.now();
      try { await Store.set('app/config', cfg); writeLog('모든 태블릿 새로고침', []); toast('새로고침 신호를 보냈습니다'); } catch (x) { toast(saveErr(x)); }
    },
    async prune() {
      const now = Date.now(); const old = Object.entries(S.status || {}).filter(([, s]) => !s || now - (s.lastSeen || 0) > 86400000);
      if (!old.length) return toast('정리할 기록이 없습니다');
      for (const [id] of old) { try { await Store.del('status/' + id); } catch (x) {} }
      toast(old.length + '개 기록을 정리했습니다');
    },
    'pick-file'() { $('#mediaFile').click(); },
    async 'wk-new'() {
      if (this.dirty && !(await ask('저장하지 않은 변경', '편집 중인 주차의 변경을 버릴까요?', '버리기', true))) return;
      const sorted = S.weeks.filter(w => w.end).sort((a, b) => a.end < b.end ? -1 : 1);
      let start;
      if (sorted.length) { start = new Date(sorted[sorted.length - 1].end + 'T00:00'); start.setDate(start.getDate() + 1); }
      else { start = new Date(); start.setDate(start.getDate() - ((start.getDay() + 6) % 7)); }
      const end = new Date(start); end.setDate(end.getDate() + 6);
      const w = { id: uid(), label: (S.weeks.length + 1) + '주차', start: ymd(start), end: ymd(end), timetable: [], wifi: [], notices: [], media: [], ticker: '' };
      try { await this.saveWeeks([...S.weeks, w], '주차 추가', [w.label], { type: 'week', id: w.id, data: null }); } catch (x) { return toast(saveErr(x)); }

    async 'wk-save'() {
      const d = clone(this.draft);
      if (d.start && d.end && d.start > d.end) return toast('종료일이 시작일보다 빠릅니다');
      const all = [...d.wifi, ...d.notices, ...d.media, ...d.timetable];
      if (all.some(x => x.from && x.to && x.from >= x.to)) return toast('게시 종료가 게시 시작보다 빠른 항목이 있습니다');
      d.timetable = d.timetable.filter(r => r.start || r.title).map(r => Object.assign(r, { start: normTime(r.start), end: normTime(r.end) }));
      const bad = all.some(x => Array.isArray(x.target) && !x.target.length);
      if (bad && !(await ask('대상 반이 비어 있음', '‘특정 반만’을 골랐지만 반을 하나도 선택하지 않은 항목이 있습니다. 그 항목은 어느 화면에도 나오지 않습니다. 그대로 저장할까요?', '그대로 저장'))) return;
      const old = S.weeks.find(w => w.id === d.id) || null;

      try { await this.saveWeeks(list, `주차 저장: ${d.label}`, diffWeek(old, d), { type: 'week', id: d.id, data: clone(old) }); this.dirty = false; this.loadDraft(d.id); toast('저장했습니다. 태블릿에 곧 반영됩니다'); this.renderTab(); }
      catch (x) { toast(saveErr(x)); }

    async 'wk-dup'() {
      const d = clone(this.draft); d.id = uid();
      const shift = s => { if (!s) return s; const t = new Date(s + 'T00:00'); t.setDate(t.getDate() + 7); return ymd(t); };
      const shiftDT = s => { if (!s) return s; const t = new Date(s); t.setDate(t.getDate() + 7); return ymd(t) + 'T' + hm(t); };
      d.start = shift(d.start); d.end = shift(d.end);
      const m = /^(\d+)(.*)$/.exec(d.label || ''); d.label = m ? (Number(m[1]) + 1) + m[2] : (d.label || '') + ' (복사본)';
      ['wifi', 'notices', 'media', 'timetable'].forEach(k => (d[k] || []).forEach(x => { x.id = uid(); if (x.from) x.from = shiftDT(x.from); if (x.to) x.to = shiftDT(x.to); if (x.date) x.date = shift(x.date); }));
      try { await this.saveWeeks([...S.weeks, d], '주차 복제', [`${this.draft.label} → ${d.label}`], { type: 'week', id: d.id, data: null }); this.loadDraft(d.id); this.renderTab(); toast('다음 주로 복제했습니다. 비밀번호를 확인해 저장하세요'); }

    /* 관리자 계정 */
    'adm-add'() {
      const fb = Auth.fb();
      form('관리자 추가', fb ? '새 관리자의 이름, 이메일, 임시 비밀번호를 정하세요. 비밀번호는 본인에게 따로 전달하고 첫 로그인 후 바꾸게 하세요.' : '새 관리자의 이름과 관리자 코드를 정하세요. 코드는 본인에게 따로 전달하세요.',

          if (v.pw !== v.pw2) return err('비밀번호 확인이 다릅니다.');

      }

        let list = S.weeks.filter(w => w.id !== u.id);
        if (u.data) { const i = S.weeks.findIndex(w => w.id === u.id); list = S.weeks.slice(); if (i >= 0) list[i] = clone(u.data); else list.push(clone(u.data)); }
        try { await Store.set('app/weeks', { list }); S.weeks = list; writeLog('되돌리기', [`${e.action} (${stamp(e.t)}, ${e.who})`], { type: 'week', id: u.id, data: clone(cur || null) }); this.draft = null; this.draftId = null; toast('되돌렸습니다'); this.renderTab(); }
        catch (x) { toast(saveErr(x)); }
      } else if (u.type === 'config') {
        if (!(await ask('되돌리기', `꾸미기·설정을 ${stamp(e.t)} 변경 직전 상태로 되돌립니다. 관리자 계정은 바뀌지 않습니다.`, '되돌리기', true))) return;
        const cfg = Object.assign(clone(S.config), clone(u.data));
        try { await this.saveConfig(cfg, '되돌리기', [`${e.action} (${stamp(e.t)}, ${e.who})`]); toast('되돌렸습니다'); this.renderTab(); } catch (x) { toast(saveErr(x)); }
      }
    },
    async 'log-prune'() {
      if (!(await ask('오래된 이력 정리', '60일이 지난 변경 이력을 지웁니다.', '정리', true))) return;
      try { const ids = await Store.olderThan('log', Date.now() - 60 * 86400000); for (const id of ids) await Store.del('log/' + id); toast(ids.length + '개를 정리했습니다'); } catch (x) { toast(saveErr(x)); }
    },

    /* 데이터 */
    async 'bk-copy'() { const t = $('#bkOut'); t.select(); try { await navigator.clipboard.writeText(t.value); toast('복사했습니다'); } catch (e) { toast('선택된 내용을 복사하세요'); } },
    async 'bk-import'() {
      let data; try { data = JSON.parse($('#bkIn').value); } catch (e) { return toast('JSON 형식이 올바르지 않습니다'); }
      if (!data || !Array.isArray(data.weeks)) return toast('백업 내용이 아닙니다');
      if (!(await ask('백업 불러오기', '지금 콘텐츠와 꾸미기·설정을 백업 내용으로 바꿉니다. 관리자 계정은 유지됩니다.', '불러오기', true))) return;
      const cfg = mergeConfig(Object.assign({}, data.config || {}, { adminHash: S.config.adminHash, reloadToken: S.config.reloadToken }));
      try { await Store.set('app/config', cfg); await Store.set('app/weeks', { list: data.weeks }); if (Array.isArray(data.alerts)) await Store.set('app/alerts', { list: data.alerts }); S.config = cfg; S.weeks = data.weeks; this.cfgDraft = null; writeLog('백업 불러오기', [`주차 ${data.weeks.length}개`]); this.renderTab(); toast('불러왔습니다'); }
      catch (x) { toast(saveErr(x)); }
    },
    async 'media-clean'() {
      try {
        const keep = mediaRefs(S.weeks, S.config); let all = [];
        if (Store.mode === 'claude') { if (!Store.assets) return; const { assets } = await Store.assets.list(); all = assets.map(a => 'asset:' + a.id); }
        else if (Store.mode === 'local') all = LS.keys().filter(k => k.startsWith('tsd-db:media/')).map(k => 'media:' + k.slice(13));
        else { const tok = await firebase.auth().currentUser.getIdToken(); const r = await fetch(FIREBASE_CONFIG.databaseURL.replace(/\/$/, '') + '/media.json?shallow=true&auth=' + encodeURIComponent(tok)); all = Object.keys((await r.json()) || {}).map(k => 'media:' + k); }
        const orphan = all.filter(s => !keep.has(s));
        if (!orphan.length) return toast('정리할 파일이 없습니다');
        if (!(await ask('쓰지 않는 파일 정리', `어느 주차에도 쓰이지 않는 이미지 ${orphan.length}개를 지웁니다. 변경 이력으로 되돌린 주차의 이미지는 사라질 수 있습니다.`, '정리', true))) return;
        for (const s of orphan) await Store.delMedia(s);
        writeLog('쓰지 않는 이미지 정리', [orphan.length + '개']);
        toast(orphan.length + '개를 정리했습니다');
      } catch (x) { toast(x && x.code ? saveErr(x) : '파일 목록을 읽지 못했습니다'); }
    }
  },

  /* ----- 긴급 공지 ----- */

        <div class="lv-cards">${Object.entries(LEVELS).map(([k, v]) => `<label class="lv-card ${k}"><input type="radio" name="lv" data-lv="1" value="${k}" ${a.level === k ? 'checked' : ''}><b>${v.name}</b><small>${v.desc}</small></label>`).join('')}</div>
        <div class="row" style="grid-template-columns:1fr"><label class="f"><span>제목</span><input type="text" data-k="title" value="${esc(a.title)}" placeholder="예: 3교시 시작이 10분 늦춰집니다"></label>
        <label class="f"><span>내용 (선택)</span><textarea rows="3" data-k="body">${esc(a.body)}</textarea></label></div>
        <div class="row"><label class="f"><span>유지 시간</span><select data-k="dur">${[['5', '5분'], ['10', '10분'], ['30', '30분'], ['60', '1시간'], ['180', '3시간'], ['today', '오늘 자정까지'], ['manual', '직접 내릴 때까지']].map(([v, n]) => `<option value="${v}"${a.dur === v ? ' selected' : ''}>${n}</option>`).join('')}</select></label></div>
        <label class="f" style="margin-bottom:6px"><span>받을 대상</span></label>${this.targetPicker('target', a.target)}
        <div class="inline" style="margin-top:18px"><button class="btn warn" data-act="alert-send">지금 보내기</button></div>
      </section>
      <section class="card"><h2>진행 중 ${act.length}건</h2>${act.length ? act.map(x => row(x, true)).join('') + `<div style="margin-top:10px"><button class="btn" data-act="alert-clear-all">모두 내리기</button></div>` : '<p class="desc" style="margin:0">지금 화면에 떠 있는 일시 공지가 없습니다.</p>'}</section>
      ${past.length ? `<section class="card"><h2>최근 기록</h2>${past.map(x => row(x, false)).join('')}</section>` : ''}`;
  },

    return `<section class="card"><h2>변경 이력</h2><p class="desc">최근 200건입니다. 콘텐츠와 꾸미기·설정은 ‘되돌리기’로 저장 직전 상태로 돌릴 수 있습니다.</p>
      <div class="row"><label class="f"><span>검색 (이름·내용)</span><input type="search" id="logQ" value="${esc(q)}" placeholder="예: ${esc(S.who || '홍길동')}, 공지, Wi-Fi"></label></div>
      ${list.length ? list.map(e => `<div class="list-row"><div class="m"><small>${stamp(e.t)} · <b style="display:inline;color:var(--ink)">${esc(e.who)}</b></small><b>${esc(e.action)}</b>${(e.detail || []).length ? `<ul>${e.detail.slice(0, 12).map(d => `<li>${esc(d)}</li>`).join('')}${e.detail.length > 12 ? `<li>외 ${e.detail.length - 12}건</li>` : ''}</ul>` : ''}</div>
        <div class="r">${e.undo ? `<button class="btn sm" data-act="log-undo" data-id="${esc(e._id)}">되돌리기</button>` : ''}</div></div>`).join('') : '<p class="desc" style="margin:0">기록이 없습니다.</p>'}
      <div style="margin-top:14px"><button class="btn sm" data-act="log-prune">60일 지난 이력 정리</button></div></section>`;
  }
};
const PRESETS = [
  { label: '쉬는 시간 종료', level: 'info', title: '잠시 후 수업이 다시 시작됩니다', body: '자리로 돌아와 주세요.', target: 'all', dur: '10' },
  { label: '일정 변경', level: 'breaking', title: '오후 일정이 변경되었습니다', body: '', target: 'all', dur: '60' },
  { label: '점심 안내', level: 'info', title: '점심 식사 안내', body: '', target: 'all', dur: '60' },
  { label: '대피', level: 'emergency', title: '안내 방송에 따라 즉시 대피해 주세요', body: '엘리베이터를 쓰지 말고 가까운 비상계단으로 이동하세요.', target: 'all', dur: 'manual' }
];
window.addEventListener('resize', () => { if (S.view === 'admin') Preview.schedule(); });

/* ================= 시작 ================= */
async function main() {
  const p = new URLSearchParams(location.search);
  if (p.get('class')) LS.set('tsd-class', p.get('class'));
  S.classId = LS.get('tsd-class', null);
  const wantAdmin = p.has('admin') || location.hash === '#admin';
  $('#app').innerHTML = '<main class="setup"><p>불러오는 중…</p></main>';
  await Store.init();
  Store.watch('app/config', (v, server) => { S.config = mergeConfig(v); if (server) S.loaded.config = true; onData('config'); });
  Store.watch('app/weeks', (v, server) => { S.weeks = (v && Array.isArray(v.list)) ? v.list : []; if (server) S.loaded.weeks = true; onData('weeks'); });
  Store.watch('app/alerts', (v, server) => { S.alerts = (v && Array.isArray(v.list)) ? v.list : []; if (server) S.loaded.alerts = true; onData('alerts'); });
  Auth.init();
  const first = wantAdmin ? 'admin' : home();
  try { history.replaceState({ v: first }, ''); } catch (e) {}
  show(first);
}
main();
</script>
