<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1F2A30">
<title>연수 안내 디스플레이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Gothic+A1:wght@500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --paper:#F4F4F2; --card:#FFFFFF; --ink:#1E2327; --muted:#5F6468; --line:#DFE0DC;
  --board:#B85C00; --board-ink:#FFFFFF; --signal:#F0B90B; --signal-ink:#1D1A0C; --alert:#D0192F;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --hfont:"Gothic A1","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B2126; --card:#232B31; --ink:#EEEDEA; --muted:#9AA2A6; --line:#333C42;
    --board:#F29A1F; --board-ink:#1C1200;
  }
}
:root[data-theme="dark"]{
  --paper:#1B2126; --card:#232B31; --ink:#EEEDEA; --muted:#9AA2A6; --line:#333C42;
  --board:#F29A1F; --board-ink:#1C1200;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--board);outline-offset:2px}
#app{height:100%}
.hidden{display:none!important}
.probe{position:absolute;visibility:hidden;width:calc(var(--u) * 100);height:0}

/* ================= 디스플레이 ================= */
.display{
  --u:calc(min(1vw,1.7778vh) * var(--scale,1));
  height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;grid-template-columns:minmax(0,1fr);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
  overflow:hidden;user-select:none;-webkit-user-select:none;position:relative;
  background:var(--paper);color:var(--ink);font-family:var(--font);
}
.display.portrait{--u:calc(min(1.5vw,1vh) * var(--scale,1))}
.bgl{position:absolute;inset:0;pointer-events:none}
.bgi{background-size:cover;background-position:center}
.bgd{background:var(--paper)}
.d-head,.pins,.progress,.ticker,.sleep{position:relative;z-index:1}
.d-head{grid-row:1;display:flex;align-items:center;gap:calc(var(--u)*2);padding:calc(var(--u)*2.2) calc(var(--u)*3.6) calc(var(--u)*1.8);border-bottom:1px solid var(--line)}
.brand{flex:1;min-width:0}
.brand .t{font-size:calc(var(--u)*1.9);font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .s{font-size:calc(var(--u)*1.3);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-chip{max-width:38%;display:flex;gap:calc(var(--u)*.8);align-items:baseline;font-size:calc(var(--u)*1.45);background:color-mix(in srgb,var(--board) 16%,transparent);padding:calc(var(--u)*.55) calc(var(--u)*1.2);border-radius:99px;white-space:nowrap;overflow:hidden}
.now-chip b{color:var(--board);font-weight:700}
.now-chip span{overflow:hidden;text-overflow:ellipsis}
.wk{font-size:calc(var(--u)*1.4);color:var(--muted);white-space:nowrap}
.cls{font:inherit;color:inherit;background:transparent;font-size:calc(var(--u)*1.8);font-weight:600;border:1px solid var(--line);padding:calc(var(--u)*.35) calc(var(--u)*1.2);border-radius:calc(var(--u)*.6);white-space:nowrap;cursor:pointer;line-height:1.3}
.cls:active{background:var(--card)}
.clock{text-align:right;font-variant-numeric:tabular-nums;line-height:1.1}
.clock .hm{font-size:calc(var(--u)*3);font-weight:500}
.clock .dt{font-size:calc(var(--u)*1.2);color:var(--muted)}
.net{width:calc(var(--u)*.8);height:calc(var(--u)*.8);border-radius:50%;background:var(--board);flex:none;opacity:.8}
.net.off{background:var(--alert);opacity:1;animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}

.pins{grid-row:2;display:flex;flex-direction:column;gap:calc(var(--u)*.7);padding:0 calc(var(--u)*3.6)}
.pins:not(:empty){padding-top:calc(var(--u)*1.4)}
.pin{min-width:0;display:flex;align-items:center;gap:calc(var(--u)*1.4);background:var(--card);border:1px solid var(--line);border-left:calc(var(--u)*.55) solid var(--pc);border-radius:calc(var(--u)*.8);padding:calc(var(--u)*.9) calc(var(--u)*1.6);cursor:pointer;animation:pinIn .45s ease both}
@keyframes pinIn{from{opacity:0;transform:translateY(-30%)}to{opacity:1;transform:none}}
.pin.emergency{--pc:var(--alert);background:color-mix(in srgb,var(--alert) 14%,var(--card))}
.pin.breaking{--pc:var(--signal);background:color-mix(in srgb,var(--signal) 14%,var(--card))}
.pin.info{--pc:var(--board)}
.pin .tg{font-size:calc(var(--u)*1.25);font-weight:700;padding:calc(var(--u)*.2) calc(var(--u)*.8);border-radius:calc(var(--u)*.4);background:var(--pc);color:#fff;white-space:nowrap}
.pin.breaking .tg{color:var(--signal-ink)}
.pin.info .tg{color:var(--board-ink)}
.pin .pt{flex:1;min-width:0;font-size:calc(var(--u)*1.8);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin .pt small{font-weight:400;color:var(--muted);margin-left:calc(var(--u)*1)}
.pin .pm{font-size:calc(var(--u)*1.2);color:var(--muted);white-space:nowrap;text-align:right}

.stage{grid-row:3;position:relative;z-index:1;margin:calc(var(--u)*2.6) calc(var(--u)*3.6) 0;overflow:hidden}
.sleep{grid-row:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.4)}
.sleep .big{font-size:calc(var(--u)*11);font-weight:500;font-variant-numeric:tabular-nums;color:var(--muted)}
.sleep p{font-size:calc(var(--u)*1.8);color:var(--muted);margin:0}
.is-sleep .stage,.is-sleep .progress,.is-sleep .ctrl{display:none}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.fx-fade .slide{animation:fadeIn .7s ease both}
.fx-fade .slide.out{animation:fadeOut .6s ease both}
.fx-slide .slide{animation:slideIn .7s cubic-bezier(.2,.7,.2,1) both}
.fx-slide .slide.out{animation:slideOut .6s ease both}
.fx-slide.rev .slide{animation-name:slideInRev}
.fx-slide.rev .slide.out{animation-name:slideOutRev}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes slideIn{from{opacity:0;transform:translateX(5%)}to{opacity:1;transform:none}}
@keyframes slideOut{from{opacity:1;transform:none}to{opacity:0;transform:translateX(-5%)}}
@keyframes slideInRev{from{opacity:0;transform:translateX(-5%)}to{opacity:1;transform:none}}
@keyframes slideOutRev{from{opacity:1;transform:none}to{opacity:0;transform:translateX(5%)}}

.eyebrow{margin:0;font-size:calc(var(--u)*1.5);color:var(--muted);font-weight:500}
.wifi{flex:1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:calc(var(--u)*5);align-items:center;min-height:0}
.wifi-main{min-width:0;display:flex;flex-direction:column;gap:calc(var(--u)*2.8)}
.wifi-main h2{margin:0;font-size:calc(var(--u)*2.2);font-weight:600;color:var(--board)}
.wifi-main h2 small{display:block;color:var(--muted);font-weight:400;font-size:calc(var(--u)*1.4);margin-top:calc(var(--u)*.4)}
.lab{display:block;font-size:calc(var(--u)*1.35);color:var(--muted);margin-bottom:calc(var(--u)*.7)}
.ssid{font-size:calc(var(--u)*4.6);font-weight:700;line-height:1.15;word-break:break-all}
.tiles{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.6);--t:calc(var(--u)*6)}
.tile{width:var(--t);height:calc(var(--t)*1.28);background:var(--card);border:1px solid var(--line);border-radius:calc(var(--t)*.14);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:calc(var(--t)*.68);line-height:1;position:relative}
.tile.dg{color:var(--board)}
.tile i{font-style:normal;font-family:var(--font);font-weight:500;font-size:calc(var(--t)*.16);color:var(--muted);position:absolute;bottom:calc(var(--t)*.08);white-space:nowrap}
.nopass{font-size:calc(var(--u)*3);font-weight:600}
.qr{margin:0;background:#fff;color:#111;border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*1.6);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1)}
.qr-code img{display:block;width:calc(var(--u)*21)!important;height:calc(var(--u)*21)!important;image-rendering:pixelated}
.qr figcaption{font-size:calc(var(--u)*1.3);text-align:center;max-width:calc(var(--u)*21)}
.portrait .wifi{grid-template-columns:1fr;align-content:center;gap:calc(var(--u)*3)}
.portrait .qr{justify-self:center}

.notice{flex:1;display:flex;flex-direction:column;min-height:0;gap:calc(var(--u)*2.2)}
.n-head::before{content:"";display:block;width:calc(var(--u)*4.5);height:calc(var(--u)*.5);border-radius:9px;background:var(--tone,var(--board));margin-bottom:calc(var(--u)*1.6)}
.n-title{margin:calc(var(--u)*.4) 0 0;font-size:calc(var(--u)*4.2);line-height:1.22;font-weight:700;word-break:keep-all;overflow-wrap:anywhere}
.n-body{flex:1;min-height:0;overflow:hidden;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;line-height:1.6;font-size:calc(var(--u)*3)}
.n-body strong{color:var(--tone,var(--board));font-weight:700}
.tone-yellow{--tone:#D9A400}.tone-red{--tone:var(--alert)}.tone-ink{--tone:var(--ink)}

.media{flex:1;margin:0;display:flex;flex-direction:column;gap:calc(var(--u)*1.2);min-height:0}
.mwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;border-radius:calc(var(--u)*1);overflow:hidden}
.mwrap img{width:100%;height:100%;object-fit:contain;display:block;opacity:0;transition:opacity .4s}
.mwrap img.ok{opacity:1}
.fit-cover .mwrap img{width:100%;height:100%;object-fit:cover}
.media figcaption{font-size:calc(var(--u)*2);font-weight:500;text-align:center}

.tt{flex:1;display:flex;flex-direction:column;min-height:0;gap:calc(var(--u)*1.6)}
.tt-h{display:flex;align-items:baseline;gap:calc(var(--u)*1.6)}
.tt-h h2{margin:0;font-size:calc(var(--u)*3.4);font-weight:700}
.tt-list{flex:1;min-height:0;overflow:hidden;list-style:none;margin:0;padding:0;font-size:calc(var(--u)*2.4);display:flex;flex-direction:column;gap:.25em}
.tt-row{display:grid;grid-template-columns:6.4em minmax(0,1fr) auto;gap:1em;align-items:center;padding:.5em .8em;border-radius:.4em;position:relative;overflow:hidden}
.tt-row .tm{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85em}
.tt-row .ti{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt-row .ti small{font-weight:400;color:var(--muted);margin-left:.7em;font-size:.72em}
.tt-row .ts{font-size:.7em;font-weight:600;white-space:nowrap}
.tt-row.past{opacity:.4}
.tt-row.next{box-shadow:inset 0 0 0 1px var(--line)}
.tt-row.next .ts{color:var(--board)}
.tt-row.now{background:var(--board);color:var(--board-ink)}
.tt-row.now .tm,.tt-row.now small{color:inherit;opacity:.85}
.tt-row.now .bar{position:absolute;left:0;bottom:0;height:.14em;width:calc(var(--p) * 100%);background:var(--board-ink);opacity:.5}

.empty{flex:1;display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*1.2)}
.empty h2{margin:0;font-size:calc(var(--u)*3.6);font-weight:700}
.empty p{margin:0;font-size:calc(var(--u)*1.7);color:var(--muted)}

.progress{grid-row:4;display:flex;gap:calc(var(--u)*.5);margin:calc(var(--u)*1.8) calc(var(--u)*3.6) calc(var(--u)*1.6);min-height:3px}
.progress i{flex:1;height:3px;border-radius:9px;background:var(--line);overflow:hidden;position:relative}
.progress i.done{background:var(--muted)}
.progress i b{position:absolute;inset:0;background:var(--board);transform-origin:left;transform:scaleX(0)}

.ticker{grid-row:5;display:flex;align-items:center;gap:calc(var(--u)*1.6);background:var(--card);border-top:1px solid var(--line);height:calc(var(--u)*5*var(--ts,1));overflow:hidden;padding-left:calc(var(--u)*3.6)}
.ticker .tag{flex:none;background:var(--signal);color:var(--signal-ink);font-weight:700;border-radius:calc(var(--u)*.4);padding:calc(var(--u)*.25) calc(var(--u)*.9);font-size:calc(var(--u)*1.4*var(--ts,1))}
.ticker .rail{flex:1;position:relative;overflow:hidden;align-self:stretch}
.ticker .run{position:absolute;top:0;bottom:0;left:0;display:flex;align-items:center;white-space:nowrap;font-size:calc(var(--u)*2*var(--ts,1));will-change:transform}
.ticker .run.static{transition:opacity .5s}
.ticker .sep{display:inline-block;width:calc(var(--u)*.5);height:calc(var(--u)*.5);background:var(--muted);border-radius:50%;margin:0 calc(var(--u)*2.6);vertical-align:middle}

.overlay{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--u)*5) calc(var(--u)*6);gap:calc(var(--u)*2);animation:fadeIn .4s ease both;cursor:pointer}
.overlay .lv{font-size:calc(var(--u)*2.2);font-weight:700;display:flex;align-items:center;gap:calc(var(--u)*1)}
.overlay .lv::before{content:"";width:calc(var(--u)*1.3);height:calc(var(--u)*1.3);border-radius:50%;background:currentColor;animation:blink 1.2s steps(2) infinite}
.overlay h1{margin:0;font-size:calc(var(--u)*6);line-height:1.18;word-break:keep-all;overflow-wrap:anywhere}
.overlay .ob{max-height:45%;overflow:hidden;font-size:calc(var(--u)*3.2);line-height:1.5;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.overlay .of{font-size:calc(var(--u)*1.5);opacity:.85;display:flex;gap:calc(var(--u)*2);flex-wrap:wrap;align-items:center}
.overlay .cd{height:4px;background:currentColor;opacity:.35;transform-origin:left;margin-top:calc(var(--u)*1);border-radius:9px}
.ov-emergency{background:var(--alert);color:#fff}
.ov-breaking{background:var(--signal);color:var(--signal-ink)}

.ctrl{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + var(--u)*7.5);transform:translateX(-50%);z-index:30;display:flex;gap:calc(var(--u)*.6);background:color-mix(in srgb,var(--ink) 88%,transparent);padding:calc(var(--u)*.6);border-radius:99px;transition:opacity .3s,transform .3s}
.ctrl.off{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(20%)}
.ctrl button{border:0;background:transparent;color:var(--paper);font-size:calc(var(--u)*1.6);font-weight:600;padding:calc(var(--u)*.9) calc(var(--u)*2.2);border-radius:99px;cursor:pointer;min-height:44px}
.ctrl button:active{background:color-mix(in srgb,var(--paper) 18%,transparent)}
.ctrl .pz{color:var(--signal)}
.hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + var(--u)*8);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:calc(var(--u)*.9) calc(var(--u)*1.8);border-radius:99px;font-size:calc(var(--u)*1.35);z-index:29;transition:opacity .5s;pointer-events:none;white-space:nowrap}
.dwarn{position:fixed;left:calc(var(--u)*2);bottom:calc(env(safe-area-inset-bottom,0px) + var(--u)*6.4);z-index:35;background:var(--alert);color:#fff;font-size:calc(var(--u)*1.3);font-weight:600;padding:calc(var(--u)*.6) calc(var(--u)*1.4);border-radius:99px;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font)}
.pv-bar{position:fixed;left:calc(var(--u)*2);top:calc(env(safe-area-inset-top,0px) + var(--u)*.6);z-index:60}
.pv-bar button{border:0;background:var(--signal);color:var(--signal-ink);border-radius:99px;padding:8px 16px;font-weight:700;cursor:pointer;font-size:14px;font-family:var(--font)}

@media (prefers-reduced-motion:reduce){
  .fx-fade .slide,.fx-slide .slide,.slide.out,.pin,.overlay{animation-duration:.01s!important}
  .overlay .lv::before,.net.off{animation:none}
}

/* ================= 공통 UI ================= */
.modal{position:fixed;inset:0;z-index:100;background:rgba(5,12,14,.5);display:grid;place-items:center;padding:20px}
.modal .box{background:var(--card);color:var(--ink);border-radius:16px;max-width:460px;width:100%;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.3);font-family:var(--font)}
.modal h3{margin:0 0 8px;font-size:18px}
.modal p{margin:0 0 18px;color:var(--muted);line-height:1.6;white-space:pre-wrap;font-size:14.5px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal .menu{display:grid;gap:8px}
.modal .menu .btn{text-align:left;padding:12px 14px}
.modal .stack{display:grid;gap:10px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 15px;cursor:pointer;font-weight:500;font-size:14px;line-height:1.3;transition:border-color .15s,background .15s;white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--muted) 60%,var(--line))}
.btn.pri{background:var(--board);color:var(--board-ink);border-color:var(--board);font-weight:600}
.btn.warn{background:var(--alert);color:#fff;border-color:var(--alert);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;cursor:pointer;font-size:14.5px;font-weight:500;color:var(--muted);padding:8px 10px 8px 4px;border-radius:8px}
.back:hover{color:var(--ink)}
.back::before{content:"";width:9px;height:9px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-left:6px}
.link{border:0;background:none;color:var(--board);cursor:pointer;padding:0;font-size:14px;text-decoration:underline}

.setup{max-width:900px;margin:0 auto;padding:28px 24px 48px}
.setup h1{font-size:28px;margin:18px 0 8px;font-weight:700}
.setup p{color:var(--muted);margin:0 0 28px;line-height:1.6}
.grid-cls{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.grid-cls button{padding:20px 10px;font-size:18px;font-weight:600;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.grid-cls button:hover,.grid-cls button[aria-current="true"]{border-color:var(--board)}
.grid-cls button[aria-current="true"]{box-shadow:inset 0 0 0 1px var(--board)}
.grid-cls button.lobby{grid-column:1/-1;font-size:16px;text-align:left;padding:16px 18px}
.grid-cls button.lobby small{display:block;color:var(--muted);font-weight:400;font-size:13px;margin-top:3px}

.adm{min-height:100%;font-size:15px}
.adm-top{display:flex;gap:10px;align-items:center;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.adm-top .ttl{flex:1;min-width:0}
.adm-top h1{font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adm-top .mode{font-size:12.5px;color:var(--muted)}
.adm-top .me{font-size:13px;color:var(--muted);white-space:nowrap}
.adm-top .me b{color:var(--ink)}
.adm-top .r{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;padding:10px 20px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:57px;z-index:19}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;color:var(--muted);white-space:nowrap;font-size:14.5px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--paper);font-weight:600}
.adm-body{display:grid;grid-template-columns:minmax(0,1fr) 460px;gap:24px;max-width:1600px;margin:0 auto;padding:24px 20px 130px;align-items:start}
.adm-body.nopv{grid-template-columns:minmax(0,1fr);max-width:1120px}
.adm-body.nopv .pv-panel{display:none}
.adm-main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px;scroll-margin-top:130px}
.card > h2{font-size:17px;margin:0 0 4px;font-weight:600}
.card .desc{color:var(--muted);font-size:13.5px;margin:0 0 16px;line-height:1.6}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);min-width:0}
label.f > span{font-weight:500}
input[type=text],input[type=password],input[type=email],input[type=number],input[type=date],input[type=time],input[type=datetime-local],input[type=search],select,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 11px;font-size:15px;color:var(--ink);transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--board);outline:none}
textarea{resize:vertical;line-height:1.55}
input[type=range]{accent-color:var(--board);width:100%}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:12px}
.item{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:10px;background:var(--paper)}
.item-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.item-h strong{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.item-h .r{display:flex;gap:6px;flex:none}
.item details{margin-top:6px}
details > summary{cursor:pointer;font-size:13px;color:var(--muted);padding:4px 0;user-select:none}
details[open] > summary{margin-bottom:10px}
.state{font-size:11.5px;font-weight:600;border-radius:5px;padding:2px 7px;background:var(--line);color:var(--muted);white-space:nowrap}
.state.live{background:color-mix(in srgb,var(--board) 18%,transparent);color:var(--board)}
.state.sched{background:color-mix(in srgb,var(--signal) 25%,transparent);color:#8A6A00}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.seg label{display:flex;align-items:center;padding:7px 13px;cursor:pointer;font-size:13.5px;position:relative}
.seg label:has(input:checked){background:var(--ink);color:var(--paper)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:13px;cursor:pointer;background:var(--card)}
.chip:has(input:checked){background:var(--board);color:var(--board-ink);border-color:var(--board)}
.chip input{width:14px;height:14px;margin:0;accent-color:var(--board-ink)}
.wk-layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1380px){.adm-body:not(.nopv) .wk-layout{grid-template-columns:1fr}.adm-body:not(.nopv) .wk-list{position:static;flex-direction:row;flex-wrap:wrap}}
@media (max-width:840px){.wk-layout{grid-template-columns:1fr}.wk-list{position:static!important;flex-direction:row!important;flex-wrap:wrap}}
.wk-list{display:flex;flex-direction:column;gap:6px;position:sticky;top:130px}
.wk-list button.w{text-align:left;border:1px solid transparent;background:transparent;border-radius:10px;padding:10px 12px;cursor:pointer}
.wk-list button.w:hover{background:var(--card)}
.wk-list button.w[aria-current="true"]{border-color:var(--line);background:var(--card)}
.wk-list .w b{display:block;font-size:14.5px;font-weight:600}
.wk-list .w small{color:var(--muted);font-size:12.5px}
.live{display:inline-block;font-size:11px;background:var(--board);color:var(--board-ink);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px;font-weight:600}
.jump{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.jump a{font-size:13px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:5px 12px;background:var(--card)}
.jump a:hover{color:var(--ink)}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:22;background:var(--card);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.savebar .msg{margin-right:auto;font-size:13.5px;color:var(--muted)}
.savebar .msg.dirty{color:var(--alert);font-weight:600}
.lv-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:16px}
.lv-card{border:1px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer;background:var(--card);display:block;position:relative}
.lv-card input{position:absolute;opacity:0}
.lv-card b{display:block;font-size:15px;margin-bottom:4px}
.lv-card small{color:var(--muted);font-size:12.5px;line-height:1.5}
.lv-card.emergency:has(input:checked){border-color:var(--alert);box-shadow:inset 0 0 0 1px var(--alert)}
.lv-card.breaking:has(input:checked){border-color:#D9A400;box-shadow:inset 0 0 0 1px #D9A400}
.lv-card.info:has(input:checked){border-color:var(--board);box-shadow:inset 0 0 0 1px var(--board)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:5px;padding:2px 7px}
.pill.emergency{background:var(--alert);color:#fff}
.pill.breaking{background:var(--signal);color:var(--signal-ink)}
.pill.info{background:var(--board);color:var(--board-ink)}
.list-row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;border-top:1px solid var(--line);padding:13px 0}
.list-row:first-of-type{border-top:0}
.list-row .m{min-width:0;flex:1}
.list-row .m b{display:block;margin:4px 0 2px;font-weight:600}
.list-row .m small{color:var(--muted);font-size:12.5px;line-height:1.5}
.list-row .m ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--muted);line-height:1.55}
.list-row .r{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:none}
.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.st{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.st b{display:block;font-size:14.5px;font-weight:600}
.st small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.st .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-right:6px;vertical-align:1px}
.st.on .dot{background:var(--board)}
.st.stale .dot{background:#D9A400}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.cls-row{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:8px;align-items:center;margin-bottom:8px}
.cls-row code{font-size:12px;color:var(--muted)}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.media-grid .item{margin:0}
.thumb{width:100%;aspect-ratio:16/10;object-fit:contain;background:var(--card);border:1px solid var(--line);border-radius:8px;display:block;margin-bottom:10px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted);font-size:14px;margin-bottom:14px;cursor:pointer}
.drop.over{border-color:var(--board);color:var(--board)}
.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--board)}
.login{max-width:420px;margin:0 auto;padding:6vh 24px}
.login h1{font-size:24px;margin:22px 0 8px}
.login p{color:var(--muted);margin:0 0 22px;line-height:1.6}
.login form{display:grid;gap:10px}
.err{color:var(--alert);font-size:14px;min-height:20px;margin:0}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:120;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
.note{font-size:13px;color:var(--muted);line-height:1.6;background:var(--paper);border-radius:10px;padding:12px 14px}
code.k{font-family:var(--mono);font-size:12.5px;background:var(--paper);padding:1px 5px;border-radius:4px}

/* 설정 행 */
.srow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.card > h2 + .srow,.card > .desc + .srow,.srow:first-child{border-top:0}
.sl{min-width:0;flex:1}
.sl b{display:block;font-size:14.5px;font-weight:600}
.sl small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.5}
.sc{flex:none;display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sc.wide{flex:1 1 280px;max-width:440px}
@media (max-width:640px){.srow{flex-wrap:wrap}.sc,.sc.wide{flex:1 1 100%;max-width:none;justify-content:flex-start}}
.sw{position:relative;width:46px;height:28px;display:inline-block;cursor:pointer;flex:none}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.sw input:checked+span{background:var(--board)}
.sw input:checked+span::after{transform:translateX(18px)}
.sw input:focus-visible+span{outline:3px solid var(--board);outline-offset:2px}
.segb{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.segb label{position:relative;cursor:pointer}
.segb input{position:absolute;opacity:0;pointer-events:none}
.segb span{display:block;padding:6px 12px;border-radius:7px;font-size:13.5px;color:var(--muted);white-space:nowrap}
.segb input:checked+span{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.segb input:focus-visible+span{outline:2px solid var(--board)}
.rng{display:flex;align-items:center;gap:12px;width:280px;max-width:100%}
.rng output{min-width:56px;text-align:right;font-variant-numeric:tabular-nums;font-size:14px;font-weight:600}
.clr{display:flex;align-items:center;gap:8px}
.clr input[type=color]{width:46px;height:36px;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--card);cursor:pointer}
.clr code{font-family:var(--mono);font-size:12.5px;color:var(--muted);min-width:64px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:4px 0 8px}
.swatch{border:1px solid var(--line);border-radius:12px;padding:0;overflow:hidden;cursor:pointer;background:var(--card);text-align:left}
.swatch .sp{height:56px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 9px;gap:5px;font-weight:700;font-size:15px}
.swatch .sp i{display:block;height:5px;width:60%;border-radius:9px}
.swatch b{display:block;font-size:12.5px;font-weight:500;padding:7px 9px}
.swatch[aria-pressed="true"]{border-color:var(--board);box-shadow:0 0 0 2px var(--board)}
.bgthumb{width:96px;height:60px;border-radius:8px;border:1px solid var(--line);object-fit:cover;background:var(--paper)}
.acc{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card)}
.acc > summary{padding:12px 14px;font-size:14px;color:var(--ink);font-weight:600;list-style:none;display:flex;justify-content:space-between}
.acc > summary::after{content:"펼치기";font-weight:400;color:var(--muted);font-size:12.5px}
.acc[open] > summary::after{content:"접기"}
.acc > summary::-webkit-details-marker{display:none}
.acc .in{padding:0 14px 8px}
.acc .srow .sc.wide{max-width:none}

/* 연결 설정 · 점검 */
.connect textarea{font-family:var(--mono);font-size:13px}
.connect ol{margin:0 0 18px;padding-left:20px;color:var(--muted);line-height:1.8;font-size:14.5px}
.connect ol b{color:var(--ink)}
.result{margin-top:14px;border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.6}
.result.ok{background:color-mix(in srgb,var(--board) 14%,transparent)}
.result.bad{background:color-mix(in srgb,var(--alert) 12%,transparent)}
.result.warn{background:color-mix(in srgb,var(--signal) 22%,transparent)}
.diag{list-style:none;margin:0 0 14px;padding:0}
.diag li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.55}
.diag li:first-child{border-top:0}
.diag i{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;color:#fff;margin-top:1px}
.diag .ok i{background:var(--board)}.diag .warn i{background:#C99400}.diag .bad i{background:var(--alert)}
.diag small{display:block;color:var(--muted);font-size:12.5px}
.banner-bad{background:var(--alert);color:#fff;padding:10px 20px;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner-bad .btn{background:#fff;color:var(--alert);border-color:#fff}
.links{width:100%;border-collapse:collapse;font-size:14px}
.links td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:middle}
.links td:first-child{font-weight:600;white-space:nowrap}
.links td.u{color:var(--muted);font-family:var(--mono);font-size:12px;max-width:0;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.links td.b{white-space:nowrap;text-align:right}
.qrbig{display:grid;place-items:center;padding:10px;background:#fff;border-radius:12px;margin-bottom:12px}
#printArea{display:none}
@media print{
  body > *:not(#printArea){display:none!important}
  #printArea{display:grid!important;grid-template-columns:repeat(3,1fr);gap:18px;padding:10px;color:#000;font-family:var(--font)}
  #printArea .pc{border:1px solid #999;border-radius:10px;padding:12px;text-align:center;break-inside:avoid}
  #printArea .pc b{display:block;font-size:22px;margin-bottom:8px}
  #printArea .pc img{margin:0 auto;width:200px!important;height:200px!important}
  #printArea .pc small{display:block;margin-top:6px;font-size:11px;color:#444}
}

.conn-grid{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:22px;align-items:start}
@media (max-width:760px){.conn-grid{grid-template-columns:1fr}}
.conn-qr{border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;background:var(--paper)}
.conn-qr b{display:block;font-size:14.5px;margin-bottom:10px}
.conn-qr .qbox{background:#fff;border-radius:10px;padding:10px;display:grid;place-items:center;cursor:zoom-in}
.conn-qr .qbox img{width:180px!important;height:180px!important}
.conn-qr small{display:block;color:var(--muted);font-size:12.5px;line-height:1.5;margin:10px 0}
.qrmodal .box{max-width:520px;text-align:center}
.qrmodal .qbig{background:#fff;border-radius:14px;padding:16px;display:grid;place-items:center;margin:4px 0 14px}
.qrmodal .qbig img{width:min(360px,70vw)!important;height:min(360px,70vw)!important}
.qrmodal select{margin-bottom:12px}

/* 긴급 공지 단계 */
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:18px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0;padding-top:4px}
.step .no{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:13px;font-weight:700;margin-top:1px}
.step > div > b{display:block;font-size:15px;font-weight:600}
.step > div > b small{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:4px}
.help{display:block;color:var(--muted);font-size:12.5px;line-height:1.6;margin:4px 0 12px}
.sub{margin:14px 0 6px;font-size:13.5px;font-weight:600}
.tin{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.tin input[type=number]{width:74px;text-align:right}
.tin input[type=time]{width:130px}
.tin span{font-size:14px;color:var(--muted);margin-right:6px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.quick .btn{padding:5px 10px;font-size:12.5px;border-radius:99px}
.sumbox{margin-top:6px;border-radius:12px;padding:14px 16px;background:var(--paper);border:1px solid var(--line);font-size:14px;line-height:1.7}
.sumbox .w{color:var(--alert);font-size:13px;display:block;margin-top:4px}
.tplchip{display:inline-flex;align-items:center;gap:6px}
.tplchip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tplchip i.emergency{background:var(--alert)}.tplchip i.breaking{background:#D9A400}.tplchip i.info{background:var(--board)}
.exgroup{margin:10px 0 4px;font-size:12.5px;color:var(--muted);font-weight:600}
.editbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:color-mix(in srgb,var(--signal) 20%,transparent);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.editbar b{margin-right:auto}

/* 카운트다운 · 확인 버튼 */
.d-head,.pins,.stage,.cdview,.sleep,.progress,.ticker{grid-column:1}
.ackbtn{white-space:nowrap;flex:none}
.cdview{grid-row:3;position:relative;z-index:2;margin:calc(var(--u)*2.6) calc(var(--u)*3.6) 0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:calc(var(--u)*1.6);min-height:0}
.is-cd .stage{visibility:hidden}
.is-sleep .cdview{display:none}
.cdview h2{margin:0;font-size:calc(var(--u)*3.8);font-weight:700}
.cdview .num{font-size:calc(var(--u)*17);font-weight:600;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em;color:var(--board)}
.cdview .num.hot{color:var(--alert)}
.cdview p{margin:0;font-size:calc(var(--u)*2);color:var(--muted)}
.cdview .cbar{width:min(70%,calc(var(--u)*70));height:calc(var(--u)*.7);background:var(--line);border-radius:99px;overflow:hidden}
.cdview .cbar i{display:block;height:100%;background:var(--board);transform-origin:left;transition:transform 1s linear}
.cdview .fin{font-size:calc(var(--u)*7);font-weight:700;color:var(--board);line-height:1.2;word-break:keep-all}
.ackbtn{font-family:var(--font);border:0;border-radius:99px;padding:calc(var(--u)*1) calc(var(--u)*3);font-size:calc(var(--u)*2);font-weight:700;cursor:pointer;background:#fff;color:#111;align-self:flex-start;margin-top:calc(var(--u)*1);min-height:44px}
.ackbtn.done{background:transparent;color:inherit;border:2px solid currentColor;cursor:default}
.pin .ackbtn{font-size:calc(var(--u)*1.3);padding:calc(var(--u)*.5) calc(var(--u)*1.4);margin:0;align-self:center;background:var(--ink);color:var(--paper)}
.pin .ackbtn.done{background:transparent;color:var(--board);border-color:var(--board)}
.pill.countdown{background:var(--ink);color:var(--paper)}
.tplchip i.countdown{background:var(--ink)}
.lv-card.countdown:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.acklist{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.acklist span{font-size:12px;border-radius:99px;padding:2px 9px;background:var(--line);color:var(--muted)}
.acklist span.ok{background:color-mix(in srgb,var(--board) 18%,transparent);color:var(--board);font-weight:600}

/* 반 묶음 · 태블릿 상태 · 접는 섹션 */
.grp{margin-bottom:14px}
.grp h3{font-size:14px;margin:0 0 8px;display:flex;gap:8px;align-items:baseline}
.grp h3 small{font-weight:400;color:var(--muted);font-size:12.5px}
.devs{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.devs li{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.batt{display:inline-block;width:26px;height:12px;border:1.5px solid currentColor;border-radius:3px;position:relative;vertical-align:-1px;flex:none}
.batt::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:currentColor;border-radius:0 1px 1px 0}
.batt i{position:absolute;left:1px;top:1px;bottom:1px;background:var(--board);border-radius:1px}
.batt.low{color:var(--alert)}.batt.low i{background:var(--alert)}

/* 확인 버튼 강조 · 포스터 · 로고 · 캡션 */
@keyframes ackPulse{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(var(--ring),.75)}70%{transform:scale(1.05);box-shadow:0 0 0 calc(var(--u)*1.8) rgba(var(--ring),0)}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(var(--ring),0)}}

.wposter{flex:1;display:flex;flex-direction:column;min-height:0;gap:calc(var(--u)*2.4);background:radial-gradient(ellipse 70% 45% at 50% 38%,color-mix(in srgb,var(--board) 14%,transparent),transparent 70%)}
.wp-top{display:flex;align-items:center;gap:calc(var(--u)*1.4)}

function unlockAudio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} }
function chime(urgent) {
  if (!actx || !S.config.alertSound) return;
  const t = actx.currentTime; const notes = urgent ? [880, 660, 880, 660, 880] : [660, 880];
  notes.forEach((f, i) => {
    const o = actx.createOscillator(), g = actx.createGain(), s = t + i * 0.26;

async function imageToBlob(src, maxSide, quality) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  const sc = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
  return canvasBlob(c, quality);
}
const canvasBlob = (c, q) => new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('변환 실패')), 'image/jpeg', q));
async function fileToMedia(f, maxSide) {
  const big = Store.mode !== 'local', q = big ? 0.9 : 0.75; maxSide = maxSide || (big ? 2560 : 1400);
  const url = URL.createObjectURL(f);
  try { return await Store.putMedia(await imageToBlob(url, maxSide, q)); } finally { URL.revokeObjectURL(url); }
}
async function loadPdfJs() {
  if (window.pdfjsLib) return window.pdfjsLib;
  await loadScript(PDFJS + 'pdf.min.js');
  try { await loadScript(PDFJS + 'pdf.worker.min.js'); } catch (e) {}
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
  return window.pdfjsLib;
}
async function pdfToBlobs(file, maxSide, quality, onPage) {
  const lib = await loadPdfJs();
  const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false }).promise;
  const n = Math.min(pdf.numPages, 40), out = [];
  for (let i = 1; i <= n; i++) {
    onPage && onPage(i, n);
    const page = await pdf.getPage(i), v1 = page.getViewport({ scale: 1 });
    const v = page.getViewport({ scale: Math.min(3, maxSide / Math.max(v1.width, v1.height)) });
    const c = document.createElement('canvas'); c.width = Math.round(v.width); c.height = Math.round(v.height);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: x, viewport: v }).promise;
    out.push(await canvasBlob(c, quality));
  }
  return { blobs: out, total: pdf.numPages };
}

/* QR 생성: 긴 주소·한글도 정확히 인코딩되는 qrcode-generator 사용 */
function drawQR(el, text, size, level) {
  if (!el) return false;
  el.innerHTML = '';
  if (!hasQR()) { el.textContent = 'QR을 불러오지 못했습니다'; return false; }
  try {
    if (qrcode.stringToBytesFuncs && qrcode.stringToBytesFuncs['UTF-8']) qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
    const q = qrcode(0, level || 'M'); q.addData(text, 'Byte'); q.make();

    img.style.imageRendering = 'pixelated'; el.appendChild(img); return true;
  } catch (e) { console.warn(e); el.textContent = 'QR을 만들지 못했습니다'; return false; }
}

      <div class="sub">제목 (선택)</div><input type="text" id="tTitle" value="${esc(f.title)}" placeholder="${sw ? '예: 발표 시간, 실습' : '예: 모둠 활동, 쉬는 시간'}">
      ${sw ? `<div class="big"><button class="btn pri" data-t="swstart">▶ 처음부터 시작</button><button class="btn" data-t="swpause">⏸ 모두 일시정지</button><button class="btn" data-t="swresume">▶ 모두 계속</button><button class="btn" data-t="swstop">■ 모두 정지</button></div><div class="inline" style="margin-top:10px"><button class="btn warn" data-t="stop">× 끝내기 (화면 닫기)</button></div><small class="help" style="margin-top:8px">각 태블릿에서도 일시정지·정지를 할 수 있습니다. 위 목록에서 반별 상태와 정지 기록을 확인하세요.</small>`
      : `<div class="sub">시간</div>
      <div class="tin" style="margin-top:0"><input type="number" id="tM" min="0" max="600" value="${f.m}"><span>분</span><input type="number" id="tS" min="0" max="59" value="${f.s}"><span>초</span></div>
      <div class="quick">${[1, 3, 5, 10, 15, 20, 30, 60].map(m => `<button type="button" class="btn" data-t="preset" data-m="${m}">${m}분</button>`).join('')}</div>
      <div class="big"><button class="btn pri" data-t="start">▶ 시작</button><button class="btn" data-t="pause">⏸ 일시정지</button><button class="btn" data-t="resume">▶ 계속</button><button class="btn warn" data-t="stop">■ 끝내기</button><button class="btn" data-t="add" data-v="60">+1분</button><button class="btn" data-t="add" data-v="-60">−1분</button></div>`}
      <div class="sub">이 기기 화면에 보일 반</div><select id="tView">${mine.map(id => `<option value="${esc(id)}"${S.classId === id ? ' selected' : ''}>${esc(className(id))}</option>`).join('')}</select>
      <div class="inline" style="margin-top:16px"><button class="btn sm" data-t="repick">맡은 묶음 다시 고르기</button><button class="btn sm ghost" data-t="lock">강사 코드 잠그기</button></div>`;
    this.renderStatus();
    p.onclick = e => { e.stopPropagation(); const b = e.target.closest('[data-t]'); if (b) this.act(b); };
    p.onchange = e => {
      const el = e.target;
      if (el.dataset.tsel) { el.checked ? this.sel.add(el.dataset.tsel) : this.sel.delete(el.dataset.tsel); }
      if (el.id === 'tView') { LS.set('tsd-tview', el.value); Display.stop(); this.start(); }
      if (el.dataset.tpm) { this.pmode = el.dataset.tpm; this.render(); }
    };
    p.oninput = e => { const el = e.target; if (el.id === 'tM') f.m = Number(el.value) || 0; if (el.id === 'tS') f.s = Number(el.value) || 0; if (el.id === 'tTitle') f.title = el.value; };
  },
  statusText(t) {
    const ph = tmPhase(t); if (!ph) return '꺼짐';
    if (t.mode === 'sw') return tmShow(t);
    return ph === 'run' ? `진행 중 ${fmtClock(tmLeft(t))}` : ph === 'pause' ? `일시정지 ${fmtClock(tmLeft(t))}` : '끝남';
  },
  renderStatus() { const u = $('#tStat'); if (u) u.innerHTML = this.classes().map(id => `<li><span>${esc(className(id))}</span><b>${esc(this.statusText(this.tms[id]))}</b></li>`).join(''); },
  tick() {
    if (this.open) this.renderStatus();
    const f = $('#tFab'); if (!f) return;
    let run = 0, pz = 0, st = 0;
    this.classes().forEach(id => { const t = this.tms[id], ph = tmPhase(t); if (!ph) return; if (ph === 'pause') pz++; else if (ph === 'stop') st++; else run++; });
    const txt = (run || pz || st) ? `⏱ 진행 ${run}${pz ? ` · 멈춤 ${pz}` : ''}${st ? ` · 정지 ${st}` : ''}` : '⏱ 타이머·스톱워치';
    if (f.textContent !== txt) f.textContent = txt;
  },
  async act(b) {
    const a = b.dataset.t, f = this.form;
    if (a === 'close') { this.open = false; return this.render(); }
    if (a === 'preset') { f.m = Number(b.dataset.m); f.s = 0; $('#tM').value = f.m; $('#tS').value = 0; return; }
    if (a === 'repick') { this.picking = true; Display.stop(); S.teacher = false; S.view = 'teacher'; return this.start(); }
    if (a === 'lock') { LS.del('tsd-tauth'); Display.stop(); S.teacher = false; S.view = 'teacher'; return this.start(); }
    const ids = this.classes(); if (!ids.length) return toast('맡은 반이 없습니다. ‘맡은 반 다시 고르기’를 눌러 주세요');
    const now = nowS(), sec = Math.max(0, (Number(f.m) || 0) * 60 + (Number(f.s) || 0)), title = (f.title || '').trim();
    const next = id => {
      const t = this.tms[id], ph = tmPhase(t, now), isSw = t && t.mode === 'sw';
      if (a === 'swstart') return { mode: 'sw', st: 'run', startAt: now, base: 0, title, at: now };
      if (a === 'swpause') return isSw && ph === 'run' ? { mode: 'sw', st: 'pause', elapsed: swElapsed(t, now), title: t.title, at: now } : null;
      if (a === 'swstop') return isSw && (ph === 'run' || ph === 'pause') ? { mode: 'sw', st: 'stop', elapsed: swElapsed(t, now), title: t.title || '', at: now } : null;
      if (a === 'swresume') return isSw && ph === 'pause' ? { mode: 'sw', st: 'run', startAt: now, base: Number(t.elapsed) || 0, title: t.title, at: now } : null;
      if (isSw && a !== 'stop' && a !== 'start') return null;
      if (a === 'start') return sec > 0 ? { st: 'run', endAt: now + sec * 1000, total: sec, title, at: now } : null;
      if (a === 'stop') return { st: 'off', at: now };
      if (a === 'pause') return ph === 'run' ? { st: 'pause', left: tmLeft(t, now), total: t.total, title: t.title, at: now } : null;
      if (a === 'resume') return ph === 'pause' ? { st: 'run', endAt: now + tmLeft(t, now) * 1000, total: t.total, title: t.title, at: now } : null;
      if (a === 'add') {
        const d = Number(b.dataset.v) || 0;
        if (ph === 'run') { const e = Math.max(now, t.endAt + d * 1000); return Object.assign({}, t, { endAt: e, total: Math.max(1, (t.total || 0) + d), at: now }); }
        if (ph === 'pause') return Object.assign({}, t, { left: Math.max(0, tmLeft(t, now) + d), total: Math.max(1, (t.total || 0) + d), at: now });
        return null;
      }
    };
    if (a === 'start' && sec <= 0) return toast('시간을 1초 이상으로 정하세요');
    let n = 0;
    for (const id of ids) { const v = next(id); if (!v) continue; try { await Store.set('timers/' + id, v); n++; } catch (x) { toast('저장하지 못했습니다. 네트워크를 확인하세요'); return; } }
    toast(n ? `${n}개 반에 적용했습니다` : '바꿀 타이머가 없습니다');
  }
};

/* ================= 디스플레이 ================= */
const Display = {
  slides: [], idx: 0, timer: null, clockT: null, hbT: null, alertT: null, sig: '', textSig: '', tickerSig: '', tickerAnim: null, tickerT: null,
  seen: {}, fullUntil: {}, alertSig: '', alertListSig: '', wl: null, taps: [], hintT: null, resizeT: null, ctrlT: null,
  paused: false, pauseT: null, dir: 1, progAnim: null, bgSrc: null, hold: null, shown: false, shownOnce: false, forceProg: false, lay: '', HOLD: 15000,
  start() {

    </div>`;
    $('#hint').textContent = T('hint'); if (document.fullscreenElement || document.webkitFullscreenElement) $('#hint').style.opacity = 0;
    $('#disp').addEventListener('click', e => this.onTap(e));
    $('#pvExit') && $('#pvExit').addEventListener('click', e => { e.stopPropagation(); goBack(); });
    this.hintT = setTimeout(() => { const h = $('#hint'); if (h) h.style.opacity = 0; }, 15000);
    this.slides = []; this.idx = 0; this.sig = ''; this.tickerSig = ''; this.alertSig = ''; this.alertListSig = ''; this.paused = this.remotePaused(); this.bgSrc = null; this.hold = null; this.shown = false; this.shownOnce = false; this.forceProg = false; this.lay = ''; this.cmdSeen = {}; ((S.control || {}).cmds || []).forEach(c => { if (nowS() - c.at > 20000) this.cmdSeen[c.id] = 1; });
    this.tm = null; this.unTm && this.unTm(); const tcid = viewerClass(); this.unTm = tcid && tcid !== '__lobby' ? Store.watch('timers/' + tcid, v => { this.tm = v; this.tmSig = ''; this.alertSig = ''; if (S.view === 'display') this.renderAlerts(); }) : null;
    if (S.teacher) Teacher.mount();
    this.orient();
    this.refresh();
    this.clockT = setInterval(() => this.tick(), 1000);
    this.alertT = setInterval(() => this.renderAlerts(), 1000);
    if (!S.preview) { this.beat(); this.hbT = setInterval(() => this.beat(), 20000); }
    this.lockScreen();
    this.onResize = () => { clearTimeout(this.resizeT); this.resizeT = setTimeout(() => { this.orient(); this.show(this.idx, false, true); this.tickerSig = ''; this.renderTicker(); this.alertSig = ''; this.renderAlerts(); }, 250); };
    window.addEventListener('resize', this.onResize);
  },
  orient() { const d = $('#disp'); d && d.classList.toggle('portrait', innerHeight > innerWidth); },
  stop() {
    this.unTm && this.unTm(); this.unTm = null; if (S.teacher) Teacher.unmount();
    clearTimeout(this.timer); clearInterval(this.clockT); clearInterval(this.hbT); clearInterval(this.alertT); clearTimeout(this.hintT); clearInterval(this.tickerT); clearTimeout(this.ctrlT); clearTimeout(this.pauseT);
    this.tickerAnim && this.tickerAnim.cancel(); this.tickerAnim = null;
    this.onResize && window.removeEventListener('resize', this.onResize);
    try { this.wl && this.wl.release(); } catch (e) {} this.wl = null;
  },
  async lockScreen() { try { if ('wakeLock' in navigator && !S.preview && !this.wl) { this.wl = await navigator.wakeLock.request('screen'); this.wl.addEventListener('release', () => this.wl = null); } } catch (e) {} },
  async fullscreen() {
    const el = document.documentElement;
    try {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (el.requestFullscreen) await el.requestFullscreen({ navigationUI: 'hide' });
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      }
    } catch (e) {}
  },
  onTap(e) {
    unlockAudio(); this.lockScreen();

    const ak = e.target.closest('[data-ack]');
    if (ak) { e.stopPropagation(); this.sendAck(ak.dataset.ack); return; }
    const pin = e.target.closest('[data-pin]');
    if (pin) { const a = S.alerts.find(x => x.id === pin.dataset.pin); this.fullUntil[pin.dataset.pin] = Date.now() + Math.max(10, this.fullSec(a)) * 1000; this.alertSig = ''; this.renderAlerts(); return; }
    const ov = e.target.closest('[data-ov]');
    if (ov) { this.fullUntil[ov.dataset.ov] = 0; this.alertSig = ''; this.renderAlerts(); return; }
    if (e.target.closest('#brand')) {
      const now = Date.now(); this.taps = this.taps.filter(t => now - t < 3000); this.taps.push(now);
      if (this.taps.length >= 5) { this.taps = []; this.menu(); return; }
    }
    if (!S.preview) this.fullscreen();

  },
  async swAct(a) {
    if (S.preview) return toast('미리보기에서는 쓸 수 없습니다');
    const t = this.tm, cid = S.classId, now = nowS(), ph = tmPhase(t, now);
    if (!t || t.mode !== 'sw' || !cid || cid === '__lobby') return;
    let v = null;
    if (a === 'pause' && ph === 'run') v = { mode: 'sw', st: 'pause', elapsed: swElapsed(t, now), title: t.title || '', at: now };
    if (a === 'resume' && ph === 'pause') v = { mode: 'sw', st: 'run', startAt: now, base: Number(t.elapsed) || 0, title: t.title || '', at: now };
    if (a === 'stop' && (ph === 'run' || ph === 'pause')) v = { mode: 'sw', st: 'stop', elapsed: swElapsed(t, now), title: t.title || '', at: now };
    if (!v) return;
    this.tm = v; this.renderTimer();
    try { await Store.set('timers/' + cid, v); } catch (e) { toast('저장하지 못했습니다. 다시 눌러 주세요'); }
  },
  async sendAck(aid) {
    if (S.preview) return toast('미리보기에서는 확인이 기록되지 않습니다');
    LS.set('tsd-acked:' + aid, true); this.fullUntil[aid] = 0; this.alertSig = ''; this.renderAlerts();
    try { await Store.set('acks/' + ackKey(aid, S.classId || '-', S.deviceId), { aid, classId: S.classId, device: S.deviceId, at: Date.now() }); }
    catch (e) { LS.del('tsd-acked:' + aid); this.alertSig = ''; this.renderAlerts(); toast('확인을 보내지 못했습니다. 다시 눌러 주세요'); }
  },
  askClass() {
    let tm;
    const close = modal(`<h3>${esc(className(S.classId))}</h3><p>${esc(T('clsAsk'))}</p><div class="acts"><button class="btn" data-x="0">취소</button><button class="btn pri" data-x="1">반 선택하기</button></div>`, (m, cl) => {
      m.addEventListener('click', e => { const b = e.target.closest('[data-x]'); if (!b) return; clearTimeout(tm); cl(); if (b.dataset.x === '1') route('setup'); });
    });
    tm = setTimeout(close, 10000);
  },
  showCtrl() {
    const c = $('#ctrl'); if (!c || this.slides.length <= 1) return;
    $('#cPrev').textContent = T('back'); $('#cNext').textContent = T('next');
    c.classList.remove('off'); clearTimeout(this.ctrlT); this.ctrlT = setTimeout(() => c.classList.add('off'), 6000);
  },
  control(c) {
    if (c === 'prev') this.go(-1);
    if (c === 'next') this.go(1);

  },
  remotePaused() { const c = S.control || {}, p = c.pause || {}, cid = viewerClass(); return !S.preview && !!(p.all || (cid && p[cid])); },
  applyControl() {
    if (S.view !== 'display') return;
    const paused = this.remotePaused();

      this.paused = paused;

  cdHTML(a, now) {

    if (Store.issue === 'rules') return `<div class="banner-bad">태블릿이 서버에서 공지를 읽을 권한이 없습니다. Firebase 보안 규칙을 게시했는지 확인하세요. <button class="btn sm" data-act="goto" data-t="status">연결 점검</button></div>`;
    if (Store.mode === 'claude') return `<div class="banner-bad" style="background:#8A6A00">claude.ai 게시 주소입니다. claude.ai에 로그인하지 않은 태블릿에는 반영되지 않습니다. 여러 태블릿은 GitHub Pages + Firebase 주소로 연결하세요.</div>`;

  ensureCfg() { if (!this.cfgDraft) { const c = clone(S.config); delete c.adminHash; delete c.teacherHash; delete c.reloadToken; delete c.hardReloadToken; this.cfgDraft = c; } return this.cfgDraft; },

  /* ----- 홈 ----- */
  refreshStatus() {
    const a = $('#stCard'); if (a) a.innerHTML = this.statusCardHTML();

  },
  pruneStatus() {
    const now = Date.now();

  },
  statusCardHTML() {
    const now = Date.now(), LIVE = 60000, byClass = {};
    Object.values(S.status || {}).forEach(d => { if (d && d.classId && now - (d.lastSeen || 0) < LIVE) (byClass[d.classId] = byClass[d.classId] || []).push(d); });
    Object.values(byClass).forEach(a => a.sort((x, y) => String(x.device).localeCompare(String(y.device))));
    const devLine = d => {
      const b = d.bat, low = b && b.lv < 20 && !b.ch;
      const bat = b ? `<span class="batt${low ? ' low' : ''}"><i style="width:${Math.max(4, Math.min(100, b.lv)) * 0.22}px"></i></span><b${low ? ' class="lowtxt"' : ''}>${b.lv}%</b>${b.ch ? ' ⚡충전 중' : low ? ' 충전 필요' : ''}` : '<span title="iPad·iPhone 등은 브라우저가 배터리 정보를 알려주지 않습니다">배터리 정보 없음</span>';
      return `<li>${bat} · ${d.role === 'teacher' ? '<b>강사</b> · ' : ''}${esc(d.kind || '기기')}</li>`;
    };
    const cell = c => {
      const ds = byClass[c.id] || [], on = ds.length, low = ds.some(d => d.bat && d.bat.lv < 20 && !d.bat.ch);
      const tm = (S.timers || {})[c.id], ph = tmPhase(tm), pz = (S.control || {}).pause || {};
      const tags = (ph ? ` <span class="state live">${esc(tmShow(tm))}</span>` : '') + (pz.all || pz[c.id] ? ' <span class="state">⏸ 멈춤</span>' : '');
      return `<div class="st ${on ? 'on' : 'off'}${low ? ' low' : ''}"><b><span class="dot"></span>${esc(c.name)}${tags}${on > 1 ? ` <small style="display:inline;font-weight:400">${on}대</small>` : ''}</b>${on ? `<ul class="devs">${ds.slice(0, 6).map(devLine).join('')}</ul>` : '<small>꺼짐</small>'}</div>`;
    };
    const summary = cls => { const ids = new Set(cls.map(c => c.id)); const ds = Object.values(S.status || {}).filter(d => d && ids.has(d.classId) && now - (d.lastSeen || 0) < LIVE); const low = ds.filter(d => d.bat && d.bat.lv < 20 && !d.bat.ch).length; return `켜진 기기 ${ds.length}대${low ? ` · <span style="color:var(--alert);font-weight:600">배터리 부족 ${low}대</span>` : ''}`; };
    const groups = (S.config.groups || []).filter(g => g.classes.length), inGroup = new Set(groups.flatMap(g => g.classes));
    const clsOf = ids => ids.map(id => S.config.classes.find(c => c.id === id)).filter(Boolean);
    const cells = ((byClass.__lobby || []).length ? `<div class="grp"><h3>${esc(T('lobby'))}</h3><div class="st-grid">${cell({ id: '__lobby', name: T('lobby') })}</div></div>` : '')
      + (groups.length ? groups.map(g => `<div class="grp"><h3>${esc(g.name)} <small>${summary(clsOf(g.classes))}</small></h3><div class="st-grid">${clsOf(g.classes).map(cell).join('')}</div></div>`).join('')
        + (S.config.classes.some(c => !inGroup.has(c.id)) ? `<div class="grp"><h3>묶음 없음</h3><div class="st-grid">${S.config.classes.filter(c => !inGroup.has(c.id)).map(cell).join('')}</div></div>` : '')
        : `<div class="st-grid">${S.config.classes.map(cell).join('')}</div>`);
    return `<h2>반별 태블릿 상태 <small style="font-weight:400;color:var(--muted);font-size:13px">${summary(S.config.classes.concat([{ id: '__lobby' }]))}</small><span class="rt">실시간</span></h2>
      <p class="desc">지금 켜져 있는 기기만 실시간으로 보여줍니다. 화면을 닫거나 전원이 꺼지면 바로 사라집니다. 빨간 테두리는 배터리가 20% 미만인데 충전 중이 아닌 기기입니다. 안드로이드·윈도우·크롬북은 배터리가 보이고, iPad·iPhone은 브라우저 제한으로 보이지 않습니다.${Store.mode === 'local' ? '<br><b>지금은 데모 모드라 이 기기 기록만 보입니다.</b>' : ''}</p>
      ${cells}
      <div class="inline" style="margin-top:16px"><button class="btn" data-act="reload-all">모든 태블릿 새로고침</button><small class="muted">내용을 다시 불러옵니다. 태블릿의 <b>전체 화면은 그대로</b> 유지됩니다.</small></div>
      <div class="inline" style="margin-top:8px"><button class="btn ghost" data-act="reload-hard">새 버전 적용 (완전 새로고침)</button><small class="muted">GitHub에 새 파일을 올린 직후에만 쓰세요. 전체 화면이 풀리고, 태블릿 화면을 한 번 누르면 다시 전체 화면이 됩니다.</small></div>`;
  },
  tab_status() {

        <p class="desc">${wk ? `<b>${esc(wk.label)}</b> (${esc(wk.start || '')} ~ ${esc(wk.end || '')}) · ${S.config.weekMode === 'manual' ? '관리자가 고정한 프로젝트' : '오늘 날짜로 자동 선택'}<br>오늘 시간표 ${rows.length}개 · 게시 중인 공지 ${(wk.notices || []).filter(isLive).length}개 · 이미지 ${(wk.media || []).filter(isLive).length}장` : '등록된 프로젝트가 없습니다. 콘텐츠 탭에서 먼저 추가하세요.'}<br>진행 중인 긴급·공지·안내: <b>${act.length}건</b></p>

      ${this.targetPicker('target', this.ctlDraft.target)}
      <div class="ctlbtns"><button class="btn" data-act="ctl" data-v="pause">⏸ 멈춤</button><button class="btn pri" data-act="ctl" data-v="play">▶ 재생</button><button class="btn" data-act="ctl" data-v="prev">‹ 이전 화면</button><button class="btn" data-act="ctl" data-v="next">다음 화면 ›</button><button class="btn" data-act="ctl" data-v="tmoff" title="강사가 켜 둔 타이머·스톱워치를 끕니다">⏱ 타이머·스톱워치 끄기</button></div>

      <span style="margin-left:auto" class="inline"><button class="btn sm" data-act="qr-connect">기기 연결 QR</button><button class="btn sm" data-act="diag">${d ? '다시 점검' : '연결 점검'}</button></span></div>
      ${d ? `<ul class="diag" style="margin-top:12px">${d.map(([k, t, sm]) => `<li class="${k}"><i>${k === 'ok' ? '✓' : '!'}</i><div>${t}${sm ? `<small>${sm}</small>` : ''}</div></li>`).join('')}</ul>` : ''}</section>`;

  linkCard() {

    return `<section class="card"><h2>태블릿 연결</h2>

      <table class="links">${row('관리자 페이지', linkFor('admin'))}${rows.map(r => row(r.name, linkFor(r.id ? 'class=' + encodeURIComponent(r.id) : ''))).join('')}</table>

  /* ----- 콘텐츠 ----- */
  tab_weeks() {

  },
  renderWeekList() {

  },
  loadDraft(id) { const w = S.weeks.find(x => x.id === id); this.draft = w ? clone(w) : null; this.draftId = w ? w.id : null; this.dirty = false; },
  stateChip(it) {
    return { live: '<span class="state live">게시 중</span>', sched: '<span class="state sched">게시 예정</span>', ended: '<span class="state">게시 종료</span>', hidden: '<span class="state">숨김</span>' }[liveState(it)];
  },
  scopeBox(key, it, extra) {
    const t = targetText(it.target), per = it.from || it.to ? `${it.from ? stamp(new Date(it.from).getTime()) : '지금'} ~ ${it.to ? stamp(new Date(it.to).getTime()) : '계속'}` : '상시';

  period(key, it) {

  itemHead(list, i, len, title, it) {
    return `<div class="item-h"><strong><label class="pub" title="체크한 항목만 태블릿에 나옵니다"><input type="checkbox" data-pub="${list}.${i}" ${it.hidden ? '' : 'checked'}>게시</label>${title}${this.stateChip(it)}</strong><div class="r">

      <button class="btn sm" data-act="del" data-list="${list}" data-i="${i}">삭제</button></div></div>`;

  weekDates() {

      <section class="card"><h2>예약된 공지 ${sched.length}건</h2><p class="desc">정해진 시각이 되면 자동으로 나타납니다. ‘수정’을 누르면 위 입력칸에서 고칠 수 있습니다.</p>${sched.length ? sched.map(schedRow).join('') : '<p class="desc" style="margin:0">예약된 공지가 없습니다. 5단계에서 ‘날짜·시각 예약’이나 ‘매일 반복’을 고르면 여기에 생깁니다.</p>'}</section>

  renderAlertLists() { const el = $('#alLists'); if (el) el.innerHTML = this.alertListsHTML(); },
  summaryText() {
    const a = this.alertDraft, lv = LEVELS[a.level].name, w = a.when || { mode: 'now' };
    const whenT = w.mode === 'at' ? (w.at ? stamp(new Date(w.at).getTime()) + '에 보냄' : '예약 시각 미정') : w.mode === 'daily' ? `매일 ${w.time || '--:--'}에 보냄 (${w.from || '오늘'} ~ ${w.until || '계속'})` : '지금 바로 보냄';
    let show;
    if (a.level === 'countdown') show = `카운트다운 ${durText(a.dur)} → 0이 되면 ‘${a.after || T('cdDone')}’ ${fmtSec(this.afterSecOf(a))} 표시`;
    else { const fs = this.fullSecOf(a); show = (a.level === 'info' ? '상단 미니바와 흐르는 문구' : fs > 0 ? `전체화면 팝업 ${fmtSec(fs)} → 상단 미니바` : '상단 미니바') + ` · 미니바 ${durText(a.dur)}` + (a.ack && a.level !== 'info' ? '\n확인 버튼 표시' : ''); }
    return `종류: ${lv}\n대상: ${targetText(a.target)}\n제목: ${a.title || '(제목 없음)'}\n보여주기: ${show}\n언제: ${whenT}`;
  },
  summaryHTML() {
    const a = this.alertDraft, d = normDur(a.dur), w = a.when || { mode: 'now' }, cd = a.level === 'countdown', fs = this.fullSecOf(a);
    const start = w.mode === 'at' && w.at ? new Date(w.at).getTime() : Date.now(), exp = w.mode === 'daily' ? null : expiresFrom(d, start);
    const warns = [];
    if (!a.title.trim()) warns.push(cd ? '카운트다운 제목을 입력하세요.' : '제목을 입력하세요.');
    if (Array.isArray(a.target) && !a.target.length) warns.push('받을 반을 하나 이상 고르세요.');
    if (d.mode === 'for' && durSec(d) < 1) warns.push('시간을 1초 이상으로 정하세요.');
    if (w.mode === 'at' && !(start > Date.now())) warns.push('예약 시각이 이미 지났습니다.');
    if (w.mode === 'daily' && d.mode === 'manual') warns.push('매일 반복은 ‘직접 내릴 때까지’로 둘 수 없습니다.');
    if (!cd && exp && fs > 0 && fs * 1000 > exp - start) warns.push('전체화면 팝업 시간이 상단 미니바 유지시간보다 깁니다.');
    const whenT = w.mode === 'at' ? `<b>${w.at ? stamp(start) : '--'}</b>에` : w.mode === 'daily' ? `<b>매일 ${esc(w.time || '--:--')}</b>에 (${esc(w.from || '오늘')} ~ ${esc(w.until || '계속')})` : '<b>지금 바로</b>';
    const show = cd ? `<b>${esc(durText(d))}</b> 카운트다운 → 0이 되면 ‘${esc(a.after || T('cdDone'))}’를 ${fmtSec(this.afterSecOf(a))} 보여줌`
      : (a.level === 'info' ? '상단 미니바와 흐르는 문구로 조용히 표시' : fs > 0 ? `<b>${fmtSec(fs)}</b> 전체화면 팝업 → 상단 미니바` : '팝업 없이 바로 상단 미니바') + ` · 미니바 <b>${esc(durText(d))}</b>${exp && w.mode !== 'daily' ? ` <span class="muted">(${stamp(exp)}에 자동으로 내려감)</span>` : ''}${a.ack && a.level !== 'info' ? ' · 확인 버튼 표시' : ''}`;
    return `${whenT} <b>${esc(targetText(a.target))}</b>에 <b>${LEVELS[a.level].name}</b>${josa(LEVELS[a.level].name, '을', '를')} ${w.mode === 'now' ? '보냅니다' : '보내도록 예약합니다'}.<br>${show}${warns.map(x => `<span class="w">${x}</span>`).join('')}`;

        </div></div>

          ${UI.seg('when.mode', [['now', '지금 바로'], ['at', '날짜·시각 예약'], ['daily', '매일 반복']], w.mode)}
          ${w.mode === 'at' ? `<div class="tin"><input type="datetime-local" data-k="when.at" value="${esc(w.at)}" style="width:auto" aria-label="예약 시각"><span>에 보냅니다</span></div>` : ''}
          ${w.mode === 'daily' ? `<div class="tin"><span>매일</span><input type="time" data-k="when.time" value="${esc(w.time)}" aria-label="매일 보낼 시각"><span>에 · 시작일</span><input type="date" data-k="when.from" value="${esc(w.from)}" style="width:auto" aria-label="시작일"><span>종료일</span><input type="date" data-k="when.until" value="${esc(w.until)}" style="width:auto" aria-label="종료일"></div><small class="help" style="margin-top:6px">종료일을 비우면 직접 취소할 때까지 계속됩니다. 기본값은 지금 프로젝트의 종료일입니다.</small>` : ''}

        <div class="inline" style="margin-top:14px"><button class="btn ${a.level === 'countdown' ? 'pri' : 'warn'}" data-act="alert-send">${sendLabel}</button><button class="btn" data-act="tpl-save">멘트로 저장</button><button class="btn ghost" data-act="alert-reset">입력 지우기</button></div>

  },

  /* ----- 꾸미기 ----- */

    const texts = TEXT_DEFS.map(([group, pk, list]) => `<details class="acc"${pk ? ` data-pk="${pk}"` : ''}><summary>${esc(group)}</summary><div class="in">${list.map(([k, label, def]) => UI.row(esc(label), '', `${def.length > 40 ? `<textarea rows="2" data-k="texts.${k}" placeholder="${esc(def)}">${esc((c.texts || {})[k] || '')}</textarea>` : UI.text('texts.' + k, (c.texts || {})[k] || '', def)}<button class="btn sm ghost" data-act="txt-reset" data-k="${k}" ${(c.texts || {})[k] ? '' : 'disabled'}>기본값</button>`, true)).join('')}</div></details>`).join('');
    return `<div data-ctx="cfg">
      <section class="card"><h2>색과 배경</h2><p class="desc">마음에 드는 조합을 고른 뒤 필요하면 색을 하나씩 바꾸세요. 미리보기에 바로 보입니다.</p>

        ${UI.row('배경색', '', UI.color('style.bg', hex(st.bg), base.bg))}
        ${UI.row('글자색', '제목·본문 등 기본 글자', UI.color('style.ink', hex(st.ink), base.ink))}
        ${UI.row('강조색', 'Wi-Fi 제목, 진행 중 교시, 굵은 글씨', UI.color('style.accent', hex(st.accent), base.accent))}
        ${UI.row('배경 이미지', '가로 사진을 권장합니다. 글자가 잘 보이도록 위에 배경색을 살짝 덮습니다.', `${L.img ? `<img class="bgthumb" data-src="${esc(L.img)}" alt="">` : ''}${Store.canUpload() ? `<button class="btn sm" data-act="bg-pick">${L.img ? '바꾸기' : '이미지 넣기'}</button>` : '<small class="muted">업로드 권한 없음</small>'}${L.img ? '<button class="btn sm ghost" data-act="bg-remove">빼기</button>' : ''}`)}
        ${L.img ? UI.row('이미지 위 덮개', '높을수록 글자가 또렷하고 사진은 흐려집니다', UI.range('style.bgDim', st.bgDim ?? 45, 0, 90, 5, '%')) : ''}
      </section>
      ${can('logo') ? `<section class="card"><h2>회사 로고</h2><p class="desc">화면 머리글에 은은하게 넣는 회사 로고입니다. <b>Lv.3 관리자만</b> 바꿀 수 있습니다. 새 이미지를 고르면 <b>배경을 자동으로 지우고(누끼)</b>, 등록하기 전에 미리보기로 한 번 더 물어봅니다.</p>
        <div class="logo-prev"><img data-logo src="${esc(logoSrc())}" alt="" style="height:${Math.round(30 * Math.min(1.6, Math.max(.4, (Number(c.style.logoSize) || 100) / 100)))}px;opacity:${(Number(c.style.logoOp) || 70) / 100}"></div>
        <div class="inline" style="margin:12px 0 4px"><button class="btn pri" data-act="logo-pick">로고 이미지 바꾸기</button>${S.logo ? '<button class="btn" data-act="logo-reset">기본 로고로 되돌리기</button>' : ''}</div>
        <small class="help" style="margin-top:0">PNG·JPG·WebP·GIF·SVG 파일을 쓸 수 있습니다. 배경이 단색인 이미지는 가장자리부터 지우고, 이미 투명한 이미지는 그대로 씁니다.</small>
        ${UI.row('로고 표시', '', UI.sw('style.logoOn', c.style.logoOn !== false, '로고'))}
        ${c.style.logoOn !== false ? UI.row('위치', '', UI.seg('style.logoPos', [['head', '머리글 왼쪽'], ['corner', '오른쪽 아래']], c.style.logoPos || 'head')) + UI.row('크기', '작을수록 눈에 덜 띕니다', UI.range('style.logoSize', c.style.logoSize || 100, 50, 150, 5, '%')) + UI.row('진하기', '낮을수록 배경에 자연스럽게 녹아듭니다', UI.range('style.logoOp', c.style.logoOp || 70, 20, 100, 5, '%')) : ''}
      </section>` : ''}
      <section class="card"><h2>글꼴</h2><p class="desc">화면에 나오는 글자의 글꼴을 고릅니다. ‘제목·숫자’는 공지 제목, 반 이름, Wi-Fi 이름, 카운트다운·타이머 숫자에 쓰입니다.</p>
        ${(() => { FONTS.forEach(f => ensureFont(f[0])); const pick = (k, v) => `<div class="fonts">${FONTS.map(([n, label]) => `<button type="button" class="fontbtn" data-act="font-set" data-k="${k}" data-v="${esc(n)}" aria-pressed="${(v || 'IBM Plex Sans KR') === n}"><b style="font-family:${esc(fontStack(n))}">가나다 1조 123</b><small>${esc(label)}</small></button>`).join('')}</div>`;
          return `<div class="sub">본문 글꼴</div>${pick('style.font', c.style.font)}<div class="sub" style="margin-top:18px">제목·숫자 글꼴</div>${pick('style.hfont', c.style.hfont || 'Gothic A1')}`; })()}
      </section>
      <section class="card"><h2>글자와 크기</h2>
        ${UI.row('연수명', '화면 왼쪽 위', UI.text('title', c.title, '연수 안내'), true)}
        ${UI.row('부제', '장소·기간 등 (선택)', UI.text('subtitle', c.subtitle, '예: 수원컨벤션센터 · 9.28~10.2'), true)}
        ${UI.row('전체 크기', '멀리서 보이게 하려면 키우세요', UI.range('style.scale', st.scale || 100, 80, 130, 5, '%'))}
      </section>
      <section class="card"><h2>화면 넘기기</h2>
        ${UI.row('한 화면 보여주는 시간', '모든 태블릿이 같은 순간에 함께 넘어갑니다. 공지·이미지마다 따로 정한 시간은 이 시간의 배수로 맞춰집니다', UI.range('slideSec', c.slideSec, 5, 60, 1, '초'))}
        ${UI.row('넘어가는 모양', '', UI.seg('transition', [['fade', '서서히'], ['slide', '옆으로'], ['none', '바로']], c.transition))}
      </section>
      <section class="card"><h2>화면에 넣을 것</h2>
        ${UI.row('시계', '', UI.sw('showClock', c.showClock, '시계'))}
        ${UI.row('오늘 시간표 화면', '', UI.sw('timetable.on', c.timetable.on, '시간표'))}
        ${c.timetable.on ? UI.row('시간표 보여주는 시간', '', UI.range('timetable.sec', c.timetable.sec, 5, 60, 1, '초')) + UI.row('상단에 지금 교시', '다른 화면이 나올 때도 늘 표시', UI.sw('timetable.header', c.timetable.header, '지금 교시')) : ''}
        ${UI.row('아래 흐르는 문구', '문구 내용은 콘텐츠 탭에서 프로젝트별로 씁니다', UI.sw('ticker.on', c.ticker.on, '흐르는 문구'))}
        ${c.ticker.on ? UI.row('움직임', '', UI.seg('ticker.mode', [['marquee', '옆으로 흐르기'], ['static', '한 줄씩 바뀌기']], c.ticker.mode))
          + UI.row('속도', '', UI.range('ticker.speed', c.ticker.speed, 1, 10, 1, ''))
          + UI.row('글자 크기', '', UI.range('ticker.size', c.ticker.size, 70, 180, 10, '%'))
          + UI.row('앞머리 표시', '비우면 숨김', UI.text('ticker.label', c.ticker.label, '예: 안내')) : ''}
      </section>
      <section class="card"><h2>화면 문구 바꾸기</h2><p class="desc">태블릿에 나오는 고정 문구입니다. 비워두면 흐린 글씨의 기본 문구를 씁니다.</p>${texts}</section>
    </div>`;
  },

  /* ----- 설정 ----- */
  adminCard() {
    const fb = Auth.fb(), me = Auth.me || {}, myLv = lvOf(me), lv3 = can('manageAdmin'), seeAll = can('seeAdmins');
    const lvSel = a => `<select data-admlv="${esc(a.id)}" aria-label="관리자 레벨" style="width:auto;padding:5px 8px;font-size:13px">${[1, 2, 3].map(v => `<option value="${v}"${lvOf(a) === v ? ' selected' : ''}>Lv.${v}</option>`).join('')}</select>`;
    const list = S.admins.filter(a => seeAll || a.id === me.id).sort((a, b) => (b.m ? 1 : 0) - (a.m ? 1 : 0) || (a.at || 0) - (b.at || 0));
    const desc = lv3 ? `내 레벨: <b>${LV_DESC[myLv] || '-'}</b> · Lv.1 콘텐츠·공지 · Lv.2 +관리자 추가 · Lv.3 모든 권한(다른 관리자 정보 변경, 코드 관리자 만들기, 변경 이력 수정, 회사 로고 변경)`
      : seeAll ? `내 레벨: <b>${LV_DESC[myLv] || '-'}</b>` : `내 레벨: <b>${LV_DESC[myLv] || '-'}</b>`;
    return `<h2>${seeAll ? '관리자 계정' : '내 계정'}</h2><p class="desc">${desc}</p>
      ${list.map(a => {
        const self = a.id === me.id, manage = lv3 && !self && !a.m, code = (a.kind || (a.email ? 'email' : 'code')) === 'code';
        return `<div class="list-row"><div class="m"><b style="margin-top:0">${esc(a.name)}${a.m ? ' <span class="pill info">마스터</span>' : ''}${code ? ' <span class="state">코드 접속</span>' : ''}${self ? ' <span class="state live">나</span>' : ''}</b><small>${a.email && !code ? esc(a.email) + ' · ' : ''}${manage ? '' : 'Lv.' + lvOf(a) + ' · '}${code ? expText(a) + ' · ' : ''}${a.addedBy ? '추가: ' + esc(a.addedBy) : ''}</small></div>
        <div class="r">${manage ? lvSel(a) : ''}${self ? `<button class="btn sm" data-act="me-code">${fb && !code ? '내 비밀번호 바꾸기' : '내 코드 바꾸기'}</button>` : manage ? `${code && lv3 ? `<button class="btn sm" data-act="adm-showcode" data-id="${esc(a.id)}">코드 보기</button>` : ''}<button class="btn sm" data-act="adm-edit" data-id="${esc(a.id)}">정보 변경</button><button class="btn sm" data-act="adm-del" data-id="${esc(a.id)}">삭제</button>` : ''}</div></div>`;
      }).join('')}
      ${can('addAdmin') || (lv3 && fb) ? `<div class="inline" style="margin-top:12px">${can('addAdmin') ? `<button class="btn pri" data-act="adm-add">+ ${fb ? '이메일 관리자' : '관리자'} 추가</button>` : ''}${lv3 && fb ? '<button class="btn pri" data-act="adm-addcode">+ 코드로 접속하는 관리자</button>' : ''}</div>` : ''}
      ${lv3 && fb ? '<p class="desc" style="margin:10px 0 0">코드 관리자는 이메일 없이 코드 하나로 로그인합니다. 하루짜리 도우미처럼 잠깐 쓸 사람에게 사용 기한을 정해 주세요.</p>' : ''}`;
  },
  teacherCard() {
    const has = !!S.config.teacherHash, code = this.tcode;
    if (has && code === undefined) Store.get('secure/teacher').then(v => { this.tcode = (v && v.code) || ''; const el = $('#tcodeRow'); if (el) el.outerHTML = this.tcodeRow(); }).catch(() => { this.tcode = ''; });
    return `<h2>강사 페이지</h2><p class="desc">강사 주소를 열면 태블릿 화면에 <b>타이머 버튼</b>이 함께 나옵니다. 강사는 강사 코드를 넣고 맡은 <b>반 묶음</b>을 고르며, 타이머를 시작하면 그 묶음의 모든 반에 똑같이 나옵니다.</p>
      ${this.tcodeRow()}
      ${Store.mode === 'firebase' && location.protocol !== 'file:' ? UI.row('강사 페이지 주소', '강사 기기 카메라로 QR을 찍게 하세요', `<button class="btn sm" data-act="link-copy" data-u="${esc(linkFor('teacher'))}">주소 복사</button><button class="btn sm" data-act="link-qr" data-u="${esc(linkFor('teacher'))}" data-n="강사 페이지">QR</button>`) : ''}`;
  },
  tcodeRow() {
    const has = !!S.config.teacherHash, code = this.tcode;
    const val = !has ? '<span style="color:var(--alert)">아직 정하지 않아 강사 페이지를 쓸 수 없습니다</span>' : code === undefined ? '불러오는 중…' : !code ? '예전에 정한 코드라 볼 수 없습니다. ‘바꾸기’로 새로 정하세요.' : `<code class="k" style="font-size:16px">${this.showTcode ? esc(code) : '•'.repeat(Math.max(4, code.length))}</code>`;
    return `<div class="srow" id="tcodeRow"><div class="sl"><b>강사 코드</b><small>${val}</small></div><div class="sc">${has && code ? `<button class="btn sm" data-act="tcode-toggle">${this.showTcode ? '숨기기' : '보기'}</button>` : ''}<button class="btn sm${has ? '' : ' pri'}" data-act="tpin-set">${has ? '바꾸기' : '정하기'}</button></div></div>`;
  },

  tab_settings() {
    const subs = [['classes', '반·묶음'], ['design', '화면 꾸미기'], ['people', '관리자·강사'], ['devices', '기기 연결'], ['ops', '운영·데이터'], ['log', '변경 이력']];
    this.sub = this.sub || 'classes';
    const body = this['set_' + this.sub]();
    return `<div class="set-layout"><nav class="subnav">${subs.map(([k, n]) => `<button type="button" data-sub="${k}" aria-current="${this.sub === k}">${n}</button>`).join('')}</nav><div style="min-width:0">${body}</div></div>`;
  },
  set_classes() {
    const c = this.ensureCfg();
    return `<div data-ctx="cfg">
      <section class="card"><h2>반 목록</h2><p class="desc">태블릿은 처음 켤 때 이 목록에서 자기 반을 고릅니다. 모든 목록은 <b>이름순(숫자 → 영어 → 한글)</b>으로 자동 정리되어 나옵니다. 오른쪽 작은 글씨(ID)는 태블릿이 기억하는 값이라 이름을 바꿔도 연결이 유지됩니다.</p>
        ${(() => { this.clsSel = this.clsSel || new Set(); const n = c.classes.filter(x => this.clsSel.has(x.id)).length; return `<div class="inline" style="margin-bottom:10px"><label class="check"><input type="checkbox" data-clsall="1" ${c.classes.length && n === c.classes.length ? 'checked' : ''}>전체 선택</label><button class="btn sm warn" data-act="cls-del-sel" ${n ? '' : 'disabled'}>선택한 반 삭제 (${n})</button><button class="btn sm" data-act="cls-sort" title="숫자 → 영어 → 한글 순서로 정리">이름순 정렬</button></div>`; })()}
        ${c.classes.map((x, i) => `<div class="cls-row"><input type="checkbox" data-clssel="${esc(x.id)}" ${this.clsSel.has(x.id) ? 'checked' : ''} aria-label="선택" style="width:18px;height:18px;accent-color:var(--board)"><input type="text" data-k="classes.${i}.name" value="${esc(x.name)}" aria-label="반 이름"><code>${esc(x.id)}</code><button class="btn sm" data-act="cls-del" data-i="${i}">삭제</button></div>`).join('')}
        <div class="inline" style="margin-top:6px"><button class="btn" data-act="cls-add">+ 반 추가</button></div>
        <details style="margin-top:12px"><summary>한 번에 만들기 (예: 1반~46반)</summary>
          <div class="row"><label class="f"><span>반 개수</span><input type="number" id="bulkN" min="1" max="200" value="${c.classes.length || 10}"></label><label class="f"><span>이름 형식 ({n} 자리에 번호)</span><input type="text" id="bulkF" value="{n}반"></label></div>
          <button class="btn" data-act="cls-bulk">목록 새로 만들기</button></details>
      </section>
      <section class="card"><h2>반 묶음</h2><p class="desc">‘1층 전체’, ‘2권역’처럼 반을 묶어 두면 공지·콘텐츠 대상을 버튼 하나로 고를 수 있고, 홈의 태블릿 상태도 묶음별로 모아 보여줍니다. 한 반이 여러 묶음에 들어가도 됩니다.</p>
        ${(c.groups || []).map((g, i) => `<div class="grp-ed"><div class="h"><input type="text" data-k="groups.${i}.name" value="${esc(g.name)}" placeholder="묶음 이름 (예: 1층 전체)" aria-label="묶음 이름"><button class="btn sm" data-act="grp-del" data-i="${i}">묶음 삭제</button></div>
          <div class="chips" style="margin-top:0">${c.classes.map(x => `<label class="chip"><input type="checkbox" data-gc="${i}" value="${esc(x.id)}" ${g.classes.includes(x.id) ? 'checked' : ''}>${esc(x.name)}</label>`).join('')}</div></div>`).join('')}
        <button class="btn" data-act="grp-add">+ 묶음 추가</button>
      </section>
    </div>`;

  /* ----- 변경 이력 ----- */
  tab_log() {
    const q = this.logFilter.trim(), pf = this.logProj || '', ed = can('editLog');
    const pidOf = e => e.pid || (e.undo && e.undo.type === 'week' ? e.undo.id : '');
    const list = S.log.filter(e => (!q || JSON.stringify([e.who, e.action, e.detail]).includes(q)) && (!pf || (pf === '_none' ? !pidOf(e) : pidOf(e) === pf)));
    const projOpts = [['', '전체'], ...S.weeks.map(w => [w.id, w.label]), ['_none', '프로젝트 외 (공지·설정·관리자 등)']];
    return `<section class="card"><h2>변경 이력</h2><p class="desc">최근 200건입니다.${ed ? ' 되돌리기·삭제·정리를 할 수 있습니다.' : ''}</p>
      <div class="row"><label class="f"><span>프로젝트</span><select id="logProj">${projOpts.map(([v, n]) => `<option value="${esc(v)}"${pf === v ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select></label>
      <label class="f"><span>검색 (이름·내용)</span><input type="search" id="logQ" value="${esc(q)}" placeholder="예: ${esc(S.who || '홍길동')}, 공지, Wi-Fi"></label></div>
      ${ed ? (() => { this.logSel = this.logSel || new Set(); const n = list.filter(e => this.logSel.has(e._id)).length; return `<div class="inline" style="margin-bottom:6px"><label class="check"><input type="checkbox" data-lsel-all="1" ${list.length && n === list.length ? 'checked' : ''}>전체 선택</label><button class="btn sm warn" data-act="log-del-sel" ${n ? '' : 'disabled'}>선택 삭제 (${n})</button><button class="btn sm" data-act="log-prune" data-d="7">7일 지난 이력 정리</button><button class="btn sm" data-act="log-prune" data-d="30">30일 지난 이력 정리</button><button class="btn sm warn" data-act="log-del-all">이력 전체 삭제</button></div>`; })() : ''}
      <p class="desc" style="margin:4px 0 0">${list.length}건</p>
      ${list.length ? list.map(e => { const w = S.weeks.find(x => x.id === pidOf(e)); return `<div class="list-row">${ed ? `<label class="check" style="align-self:center"><input type="checkbox" data-lsel="${esc(e._id)}" ${this.logSel.has(e._id) ? 'checked' : ''} aria-label="선택"></label>` : ''}<div class="m"><small>${stamp(e.t)} · <b style="display:inline;color:var(--ink)">${esc(e.who)}</b>${w ? ` · ${esc(w.label)}` : ''}</small><b>${esc(e.action)}</b>${(e.detail || []).length ? `<ul>${e.detail.slice(0, 12).map(d => `<li>${esc(d)}</li>`).join('')}${e.detail.length > 12 ? `<li>외 ${e.detail.length - 12}건</li>` : ''}</ul>` : ''}</div>
        <div class="r">${ed && e.undo ? `<button class="btn sm" data-act="log-undo" data-id="${esc(e._id)}">되돌리기</button>` : ''}${ed ? `<button class="btn sm" data-act="log-del" data-id="${esc(e._id)}">삭제</button>` : ''}</div></div>`; }).join('') : '<p class="desc" style="margin:0">기록이 없습니다.</p>'}</section>`;
  }
};

window.addEventListener('resize', () => { if (S.view === 'admin') Preview.schedule(); });

/* ================= 시작 ================= */
async function main() {
  const p = new URLSearchParams(location.search);
  S.classId = p.get('class') || null;
  if (S.classId) LS.set('tsd-class', S.classId);
  const wantAdmin = p.has('admin') || location.hash === '#admin';
  S.teacherMode = p.has('teacher');
  $('#app').innerHTML = '<main class="setup"><p>불러오는 중…</p></main>';
  await Store.init();
  Store.watch('app/config', (v, server) => { S.config = mergeConfig(v); if (server) S.loaded.config = true; onData('config'); });
  Store.watch('app/weeks', (v, server) => { S.weeks = (v && Array.isArray(v.list)) ? v.list : []; if (server) S.loaded.weeks = true; onData('weeks'); });
  Store.watch('app/logo', v => { S.logo = (v && typeof v.src === 'string' && /^data:image\/(png|jpeg|webp|gif);base64,/.test(v.src)) ? v.src : ''; onData('logo'); });
  Store.watch('app/control', v => { S.control = v || { pause: {}, cmds: [] }; onData('control'); });
  Store.watch('app/alerts', (v, server) => { S.alerts = (v && Array.isArray(v.list)) ? v.list : []; if (server) S.loaded.alerts = true; onData('alerts'); });
  Auth.init();
  const first = wantAdmin ? 'admin' : home();
  try { history.replaceState({ v: first }, ''); } catch (e) {}
  show(first);
}
main();
</script>
